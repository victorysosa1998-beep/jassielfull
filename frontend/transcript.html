<!-- <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academic Transcript — Jaasiel RMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./css/style.css">
<style>
/* ═══ SCOPE SELECTOR ═══ */
.scope-card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  margin-bottom: 20px;
}
.scope-options {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.scope-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: .83rem;
  font-weight: 600;
  border: 1.5px solid var(--border-light);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all .15s;
}
.scope-btn:hover {
  border-color: var(--brand-gold);
  color: var(--brand-gold);
}
.scope-btn.active {
  background: rgba(201,151,58,.12);
  border-color: var(--brand-gold);
  color: var(--brand-gold);
}
.scope-range-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.scope-range-row.hidden { display: none; }

/* Download button highlight */
.btn-download {
  background: linear-gradient(135deg, #002060, #1a56c8);
  color: #fff;
  border: none;
  padding: 8px 18px;
  border-radius: 8px;
  font-weight: 700;
  font-size: .83rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: opacity .15s;
}
.btn-download:hover { opacity: .88; }
.btn-download:disabled { opacity: .5; cursor: not-allowed; }

/* ═══ TRANSCRIPT PREVIEW ═══ */
.transcript-preview { margin-top: 6px; }
.tc-session-block { margin-bottom: 20px; }

/* ═══ REPORT CARD ═══ */
.rc-page {
  background: #fff;
  color: #1a1a2e;
  max-width: 820px;
  margin: 0 auto;
  font-family: 'DM Sans', sans-serif;
  font-size: 10.5px;
  border: 3px double #002060;
  position: relative;
  page-break-after: always;
  break-after: page;
}
.rc-page:last-child { page-break-after: auto; break-after: auto; }
.rc-page::before {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(0,32,96,.15);
  pointer-events: none;
  z-index: 0;
}
.rc-head { padding:0; border-bottom:3px solid #002060; position:relative; z-index:1; background:linear-gradient(180deg,#f0f4ff 0%,#fff 100%); }
.rc-head-top { background:linear-gradient(135deg,#002060 0%,#0a3d8f 50%,#1a56c8 100%); height:7px; }
.rc-head-inner { display:flex; align-items:center; padding:12px 18px 10px; gap:14px; }
.rc-logo { width:72px; height:72px; flex-shrink:0; border-radius:50%; border:2px solid rgba(0,32,96,.2); overflow:hidden; box-shadow:0 2px 8px rgba(0,32,96,.15); background:#fff; }
.rc-logo img { width:100%; height:100%; object-fit:contain; }
.rc-school-info { flex:1; text-align:center; }
.rc-school-name { font-family:'Playfair Display',serif; font-size:24px; font-weight:900; color:#002060; letter-spacing:.5px; line-height:1.1; text-transform:uppercase; }
.rc-school-sub { font-size:9px; color:#444; margin:2px 0; font-style:italic; }
.rc-school-contact { font-size:8.5px; color:#1a56c8; margin:2px 0; }
.rc-motto { font-family:'Playfair Display',serif; font-size:10px; font-weight:700; color:#b8860b; margin-top:3px; text-transform:uppercase; letter-spacing:.8px; }
.rc-photo-box { width:72px; height:86px; flex-shrink:0; border:2px solid #002060; background:#f8f9fc; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.rc-photo-box img { width:100%; height:100%; object-fit:cover; }
.rc-title-bar { background:linear-gradient(135deg,#002060,#0a3d8f); color:#fff; padding:6px 18px; font-family:'Playfair Display',serif; font-size:13px; font-weight:700; text-align:center; letter-spacing:.5px; position:relative; z-index:1; }
.rc-info-section { padding:8px 18px; border-bottom:1px solid #dde; position:relative; z-index:1; }
.rc-row { display:flex; flex-wrap:wrap; gap:0; border:1px solid #ccd; margin-bottom:-1px; }
.rc-cell { flex:1; min-width:120px; padding:4px 8px; border-right:1px solid #ccd; display:flex; flex-direction:column; gap:1px; }
.rc-cell:last-child { border-right:none; }
.rc-cell.double { flex:2; }
.rc-cell.triple { flex:3; }
.rc-lbl { font-size:7.5px; color:#666; text-transform:uppercase; letter-spacing:.4px; font-weight:600; }
.rc-val { font-size:10px; font-weight:700; color:#1a1a2e; }
.rc-stats-row { display:flex; border:2px solid #002060; background:linear-gradient(135deg,#e8eeff,#f5f7ff); position:relative; z-index:1; }
.rc-stat-cell { flex:1; padding:6px 10px; border-right:1px solid #002060; text-align:center; display:flex; flex-direction:column; gap:2px; }
.rc-stat-cell:last-child { border-right:none; }
.rc-stat-val { font-size:14px; font-weight:900; color:#002060; font-family:'Playfair Display',serif; }
.rc-section-head { background:#002060; color:#fff; padding:4px 18px; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; position:relative; z-index:1; }
.rc-scores { width:100%; border-collapse:collapse; position:relative; z-index:1; }
.rc-scores thead th { background:#001a4e; color:#fff; padding:5px 6px; text-align:center; font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; border:1px solid #002060; }
.rc-scores thead th.left { text-align:left; }
.rc-scores tbody tr:nth-child(even) { background:#f7f9ff; }
.rc-scores tbody td { padding:4px 6px; border:1px solid #dde; font-size:9.5px; text-align:center; }
.rc-scores tbody td.left { text-align:left; font-weight:600; }
.rc-scores tfoot td { background:#e8eeff; padding:5px 6px; border:1px solid #002060; font-weight:700; font-size:10px; text-align:center; }
.rc-scores tfoot td.left { text-align:left; }
.grade-A { color:#15803d; font-weight:800; }
.grade-B { color:#1d4ed8; font-weight:800; }
.grade-C { color:#b45309; font-weight:800; }
.grade-D { color:#ea580c; font-weight:800; }
.grade-E { color:#dc2626; font-weight:800; }
.grade-F { color:#dc2626; font-weight:800; }
.rc-lower { display:grid; grid-template-columns:repeat(3,1fr); border:1px solid #ccd; position:relative; z-index:1; }
.rc-lower-col { padding:8px 10px; border-right:1px solid #ccd; }
.rc-lower-col:last-child { border-right:none; }
.rc-lower-head { background:#002060; color:#fff; padding:3px 6px; font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin:-8px -10px 6px; }
.rc-lower-table { width:100%; border-collapse:collapse; }
.rc-lower-table td { padding:2px 4px; border-bottom:1px solid #eef; font-size:9px; }
.rc-keys-head { font-size:8px; font-weight:700; color:#002060; text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px; }
.rc-keys-row { font-size:8.5px; color:#333; margin-bottom:2px; }
.rc-bill-row { display:flex; justify-content:space-between; align-items:center; padding:2px 0; border-bottom:1px dotted #dde; font-size:8.5px; }
.rc-bill-row.total { font-weight:800; color:#002060; border-top:2px solid #002060; border-bottom:none; margin-top:3px; padding-top:3px; font-size:9.5px; }
.rc-footer { padding:12px 18px; border-top:1px solid #dde; position:relative; z-index:1; }
.rc-comment-row { display:flex; align-items:flex-end; gap:8px; font-size:9px; margin-bottom:8px; }
.rc-comment-lbl { font-weight:700; color:#002060; white-space:nowrap; font-size:8.5px; padding-bottom:4px; }
.rc-comment-line { flex:1; min-width:140px; text-align:center; font-style:italic; line-height:2; border-bottom:1px solid #002060; padding-bottom:3px; }
.rc-next-bar { display:flex; gap:20px; padding:5px 18px; background:#f0f4ff; border-top:1px solid #ccd; font-size:8.5px; position:relative; z-index:1; }
.rc-next-lbl { font-weight:700; color:#002060; margin-right:4px; }
.rc-sig-area { display:flex; justify-content:space-between; align-items:flex-end; padding:14px 28px 10px; position:relative; z-index:1; }
.rc-sig-block { text-align:center; min-width:140px; }
.rc-sig-lbl { font-size:8px; color:#666; text-transform:uppercase; letter-spacing:.5px; display:block; margin-top:5px; }
.rc-sig-val { display:block; font-size:11px; font-weight:700; color:#1a1a2e; min-width:160px; text-align:center; font-style:italic; border-bottom:1.5px solid #002060; padding-bottom:6px; line-height:2; }
.rc-stamp-wrap { width:100px; height:100px; flex-shrink:0; }
.rc-stamp-img { width:100px; height:100px; object-fit:contain; mix-blend-mode:multiply; opacity:.85; }
.rc-fine-print { text-align:center; padding:4px; font-size:7.5px; color:#aaa; border-top:1px solid #dde; background:#fafbff; position:relative; z-index:1; }

@media print {
  body { background:#fff !important; }
  .page-bg,.sidebar,.topbar,.no-print { display:none !important; }
  .main-content { margin:0 !important; }
  .page-body { padding:0 !important; }
  .rc-page { box-shadow:none; border:3px double #002060; max-width:100%; }
  .scope-card { display:none; }
}
@media screen {
  .rc-page { box-shadow:0 12px 60px rgba(0,32,96,.2),0 2px 8px rgba(0,0,0,.08); border-radius:4px; overflow:hidden; }
}
</style>

<body>
<div class="page-bg"></div>
<div class="page-loader" id="page-loader"><div class="loader-logo"><i class="fas fa-graduation-cap"></i> Jaasiel RMS</div><div class="loader-ring"></div></div>
<div class="toast-container" id="toast-container"></div>
<div class="app-layout">
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar"></aside>
<div class="main-content">
  <header class="topbar no-print">
    <div class="topbar-left">
      <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
      <div>
        <div class="page-title">Academic Transcript</div>
        <div class="breadcrumb"><a href="student-dashboard.html">Dashboard</a><span class="sep">/</span><span class="text-gold">Transcript</span></div>
      </div>
    </div>
  </header>
  <div class="page-body">

    <!-- ── SCOPE SELECTOR ── -->
    <div class="scope-card no-print">
      <div style="font-family:var(--font-display);font-weight:700;font-size:.95rem;margin-bottom:12px">
        <i class="fas fa-filter" style="color:var(--brand-gold);margin-right:6px"></i>
        Choose what to download
      </div>
      <div class="scope-options">
        <button class="scope-btn active" id="scope-all" onclick="setScope('all')">
          <i class="fas fa-history"></i> All Time
        </button>
        <button class="scope-btn" id="scope-session" onclick="setScope('session')">
          <i class="fas fa-calendar-alt"></i> Full Session
        </button>
        <button class="scope-btn" id="scope-term" onclick="setScope('term')">
          <i class="fas fa-bookmark"></i> Single Term
        </button>
        <button class="scope-btn" id="scope-range" onclick="setScope('range')">
          <i class="fas fa-sliders-h"></i> Custom Range
        </button>
      </div>

      <!-- Session picker -->
      <div class="scope-range-row hidden" id="row-session">
        <label style="font-size:.82rem;color:var(--text-muted)">Session:</label>
        <select class="filter-select" id="sel-session" onchange="loadTranscript()" style="font-size:.82rem"></select>
      </div>

      <!-- Term picker -->
      <div class="scope-range-row hidden" id="row-term">
        <label style="font-size:.82rem;color:var(--text-muted)">Session:</label>
        <select class="filter-select" id="sel-term-session" onchange="onTermSessionChange()" style="font-size:.82rem"></select>
        <label style="font-size:.82rem;color:var(--text-muted)">Term:</label>
        <select class="filter-select" id="sel-term" onchange="loadTranscript()" style="font-size:.82rem"></select>
      </div>

      <!-- Range picker -->
      <div class="scope-range-row hidden" id="row-range">
        <label style="font-size:.82rem;color:var(--text-muted)">From:</label>
        <select class="filter-select" id="sel-from" style="font-size:.82rem"></select>
        <label style="font-size:.82rem;color:var(--text-muted)">To:</label>
        <select class="filter-select" id="sel-to" style="font-size:.82rem"></select>
        <button class="btn btn-primary btn-sm" onclick="loadTranscript()"><i class="fas fa-sync"></i> Generate</button>
      </div>

      <!-- Action bar -->
      <div style="display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border-light);flex-wrap:wrap">
        <button class="btn-download" onclick="downloadPDF()" id="btn-dl" disabled>
          <i class="fas fa-file-pdf"></i> Download as PDF
        </button>
        <button class="btn btn-secondary btn-sm" onclick="window.print()">
          <i class="fas fa-print"></i> Print
        </button>
        <span id="dl-label" style="font-size:.78rem;color:var(--text-muted)"></span>
      </div>
    </div>

    <!-- ── TRANSCRIPT / REPORT CARDS ── -->
    <div id="transcript-container">
      <div class="card" style="text-align:center;padding:60px;color:var(--text-muted)">
        <i class="fas fa-scroll" style="font-size:3rem;display:block;margin-bottom:16px;opacity:.3"></i>
        <div style="font-size:1rem;margin-bottom:8px">Choose a scope above to generate your transcript</div>
        <div style="font-size:.83rem">Your report cards will appear here ready to download as PDF</div>
      </div>
    </div>

  </div>
</div>
</div>

<script src="./js/core.js"></script>
<script src="./js/ui.js"></script>
<script>
const LOGO_SRC  = './images/logo.png';
const STAMP_SRC = 'images/schoolstamp.png';

let _sessions = [];
let _currentScope = 'all';
let _currentResults = [];
let _currentMeta = {};

document.addEventListener('DOMContentLoaded', async () => {
  await window.__rmsBootstrapReady;
  initPage('student', 'student');
  await loadSessionDropdowns();
  loadTranscript();
});

/* ─────────────────────────────────────────────
   DROPDOWNS
───────────────────────────────────────────── */
async function loadSessionDropdowns() {
  try {
    const data = await API.students.mySessions();
    _sessions = data.items || [];
    const ids = ['sel-session','sel-term-session','sel-from','sel-to'];
    ids.forEach(id => {
      const sel = document.getElementById(id);
      if (!sel) return;
      sel.innerHTML = (id === 'sel-from' || id === 'sel-to')
        ? '<option value="">— Any —</option>'
        : '<option value="">Select…</option>';
      _sessions.forEach(s => {
        const o = document.createElement('option');
        o.value = s.id; o.textContent = s.session_name;
        if (s.is_current && id !== 'sel-from' && id !== 'sel-to') o.selected = true;
        sel.appendChild(o);
      });
    });
    const toSel = document.getElementById('sel-to');
    if (_sessions.length && toSel) toSel.value = _sessions[0].id;
    populateTermSel(document.getElementById('sel-term-session')?.value);
  } catch(e) { console.warn('loadSessionDropdowns failed', e); }
}

function populateTermSel(sid) {
  const sel = document.getElementById('sel-term');
  if (!sel) return;
  sel.innerHTML = '<option value="">Select…</option>';
  const sess = _sessions.find(s => String(s.id) === String(sid));
  if (sess?.terms) {
    sess.terms.forEach(t => {
      const o = document.createElement('option');
      o.value = t.id; o.textContent = t.term_name;
      if (t.is_current) o.selected = true;
      sel.appendChild(o);
    });
  }
}

function onTermSessionChange() {
  populateTermSel(document.getElementById('sel-term-session').value);
  loadTranscript();
}

/* ─────────────────────────────────────────────
   SCOPE
───────────────────────────────────────────── */
function setScope(scope) {
  _currentScope = scope;
  ['all','session','term','range'].forEach(s => {
    document.getElementById(`scope-${s}`).classList.toggle('active', s === scope);
  });
  ['row-session','row-term','row-range'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
  if (scope === 'session') document.getElementById('row-session').classList.remove('hidden');
  if (scope === 'term')    document.getElementById('row-term').classList.remove('hidden');
  if (scope === 'range')   document.getElementById('row-range').classList.remove('hidden');
  if (scope !== 'range') loadTranscript();
}

/* ─────────────────────────────────────────────
   LOAD TRANSCRIPT
───────────────────────────────────────────── */
async function loadTranscript() {
  const container = document.getElementById('transcript-container');
  const dlBtn     = document.getElementById('btn-dl');
  const dlLabel   = document.getElementById('dl-label');
  dlBtn.disabled  = true;
  dlLabel.textContent = '';
  showSkeleton(container, 4, '100px', '12px');

  try {
    const params = {};
    let filterDesc = 'Full academic history';

    if (_currentScope === 'session') {
      const sid = document.getElementById('sel-session').value;
      if (sid) params.session_id = sid;
      const sess = _sessions.find(s => String(s.id) === String(sid));
      if (sess) filterDesc = sess.session_name;
    } else if (_currentScope === 'term') {
      const sid = document.getElementById('sel-term-session').value;
      const tid = document.getElementById('sel-term').value;
      if (sid) params.session_id = sid;
      if (tid) params.term_id    = tid;
      const sess = _sessions.find(s => String(s.id) === String(sid));
      const term = sess?.terms?.find(t => String(t.id) === String(tid));
      filterDesc = [sess?.session_name, term?.term_name].filter(Boolean).join(' · ');
    } else if (_currentScope === 'range') {
      const fromId   = document.getElementById('sel-from').value;
      const toId     = document.getElementById('sel-to').value;
      const fromSess = _sessions.find(s => String(s.id) === String(fromId));
      const toSess   = _sessions.find(s => String(s.id) === String(toId));
      filterDesc = [fromSess?.session_name, toSess?.session_name].filter(Boolean).join(' → ');
    }

    const data   = await API.students.myResults(params);
    let results  = data.results || [];
    _currentMeta = data;

    if (_currentScope === 'range') {
      const fromId = parseInt(document.getElementById('sel-from').value) || 0;
      const toId   = parseInt(document.getElementById('sel-to').value)   || Infinity;
      if (fromId || toId !== Infinity) {
        results = results.filter(r => {
          const sid = r.session_id || 0;
          return sid >= fromId && sid <= toId;
        });
      }
    }

    _currentResults = results;

    if (!results.length) {
      container.innerHTML = `<div class="card" style="text-align:center;padding:60px;color:var(--text-muted)">
        <i class="fas fa-inbox" style="font-size:3rem;display:block;margin-bottom:16px;opacity:.3"></i>
        No results found for the selected range. Results appear once published by your school.
      </div>`;
      return;
    }

    const grouped = {};
    results.forEach(r => {
      const sk = r.session_id;
      const tk = r.term_id;
      if (!grouped[sk]) grouped[sk] = { session_name: r.session_name||'—', terms: {} };
      if (!grouped[sk].terms[tk]) grouped[sk].terms[tk] = { term_name: r.term_name||'—', results: [] };
      grouped[sk].terms[tk].results.push(r);
    });

    const allTotals  = results.map(r => r.total_score || 0);
    const overallAvg = allTotals.length ? allTotals.reduce((a,b)=>a+b,0) / allTotals.length : 0;
    const sessKeys   = Object.keys(grouped).sort((a,b) => parseInt(a)-parseInt(b));
    let termCount    = 0;
    sessKeys.forEach(sk => termCount += Object.keys(grouped[sk].terms).length);

    container.innerHTML = `
      <div class="card mb-3 no-print" style="background:linear-gradient(135deg,var(--bg-card),rgba(201,151,58,.05));border-color:rgba(201,151,58,.2)">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
          <div>
            <div style="font-family:var(--font-display);font-size:1.1rem;font-weight:900">${data.full_name||'—'}</div>
            <div style="font-size:.8rem;color:var(--text-muted);margin-top:2px">
              ${data.student_id||''} · ${data.class_name||'—'}
              ${filterDesc ? ' · <strong style="color:var(--brand-gold)">' + filterDesc + '</strong>' : ''}
            </div>
          </div>
          <div style="display:flex;gap:20px;flex-wrap:wrap">
            <div style="text-align:center">
              <div style="font-family:var(--font-mono);font-size:1.5rem;font-weight:900;color:var(--brand-gold)">${overallAvg.toFixed(1)}</div>
              <div style="font-size:.68rem;color:var(--text-muted);text-transform:uppercase">Avg Score</div>
            </div>
            <div style="text-align:center">
              <div style="font-family:var(--font-mono);font-size:1.5rem;font-weight:900;color:var(--brand-gold)">${sessKeys.length}</div>
              <div style="font-size:.68rem;color:var(--text-muted);text-transform:uppercase">Sessions</div>
            </div>
            <div style="text-align:center">
              <div style="font-family:var(--font-mono);font-size:1.5rem;font-weight:900;color:var(--brand-gold)">${termCount}</div>
              <div style="font-size:.68rem;color:var(--text-muted);text-transform:uppercase">Terms</div>
            </div>
          </div>
        </div>
      </div>

      ${sessKeys.map(sk => {
        const sess = grouped[sk];
        return Object.keys(sess.terms).sort((a,b)=>parseInt(a)-parseInt(b)).map(tk => {
          const term = sess.terms[tk];
          const cardData = { ...data, session_name: sess.session_name, term_name: term.term_name };
          return buildCardHTML(cardData, term.results);
        }).join('<div style="height:20px" class="no-print"></div>');
      }).join('<div style="height:20px" class="no-print"></div>')}
    `;

    dlBtn.disabled = false;
    dlLabel.textContent = `${termCount} report card${termCount !== 1 ? 's' : ''} ready`;

function _loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function downloadPDF() {
  const btn = document.getElementById('btn-dl');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating PDF…';

  try {
    // 1. Get cards
    const cards = [...document.querySelectorAll('#transcript-container .rc-page')];
    if (!cards.length) {
      alert('No report cards to download. Please generate a transcript first.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-file-pdf"></i> Download as PDF';
      return;
    }

    // 2. Load libraries
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading libraries…';
    await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');

    const { jsPDF } = window.jspdf;

    // A4 dimensions in mm
    const PAGE_W = 210, PAGE_H = 297;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });

    // 3. Create a single hidden iframe with correct styles already loaded.
    //    We render each card inside it one at a time → no CSS variable issues.
    const iframe = document.createElement('iframe');
    Object.assign(iframe.style, {
      position: 'fixed',
      top: '0', left: '-9999px',
      width: '794px', height: '1200px', // tall enough to render full card without collapsing
      border: 'none', opacity: '0',     // opacity:0 hides it visually but does NOT affect html2canvas
      pointerEvents: 'none',
    });
    document.body.appendChild(iframe);

    // Write base document into iframe once
    const iDoc = iframe.contentDocument || iframe.contentWindow.document;
    iDoc.open();
    iDoc.write(`<!DOCTYPE html><html><head>
      <meta charset="UTF-8">
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
      <style>${_RC_STYLES}</style>
    </head><body style="margin:0;padding:0;background:#fff"></body></html>`);
    iDoc.close();

    // Inject html2canvas into the iframe so it runs in the correct window context
    await new Promise((resolve, reject) => {
      const s = iDoc.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      s.onload = resolve; s.onerror = reject;
      iDoc.head.appendChild(s);
    });

    // Wait for iframe fonts to load
    await new Promise(r => setTimeout(r, 900));

    // 4. Render each card
    for (let i = 0; i < cards.length; i++) {
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Rendering card ${i + 1} of ${cards.length}…`;

      // Put this card's HTML into the iframe body
      iDoc.body.innerHTML = cards[i].outerHTML;
      const cardEl = iDoc.body.firstElementChild;

      // Fix image srcs to absolute URLs
      cardEl.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src');
        if (src && !src.startsWith('http') && !src.startsWith('data:')) {
          img.src = new URL(src, window.location.href).href;
        }
      });

      // Wait for all images to load
      const imgs = [...cardEl.querySelectorAll('img')];
      await Promise.all(imgs.map(img =>
        img.complete ? Promise.resolve()
          : new Promise(r => { img.onload = r; img.onerror = r; })
      ));

      // Size iframe to exact card height so nothing is cropped
      const cardH = cardEl.scrollHeight;
      iframe.style.height = (cardH + 40) + 'px';

      // Two rAFs: layout + paint flush
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

      // Capture using html2canvas running INSIDE the iframe's own window
      const iWin = iframe.contentWindow;
      const canvas = await iWin.html2canvas(cardEl, {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#ffffff',
        logging: false,
        width: 794,
        windowWidth: 794,
        scrollX: 0,
        scrollY: 0,
      });

      // Add page (first page already exists)
      if (i > 0) pdf.addPage();

      const imgData = canvas.toDataURL('image/jpeg', 0.97);

      // canvas captured at scale:2 → logical width = canvas.width / 2 = 794px
      // Map 794px → 210mm (PAGE_W). Height preserves aspect ratio.
      const pxToMm = PAGE_W / 794;
      const imgH   = (canvas.height / 2) * pxToMm;

      pdf.addImage(imgData, 'JPEG', 0, 0, PAGE_W, imgH);
    }

    // 5. Cleanup and save
    iframe.remove();
    pdf.save('Jaasiel_Transcript.pdf');

  } catch (err) {
    console.error('PDF error:', err);
    alert('PDF generation failed: ' + err.message + '\n\nTry using the Print button as a fallback.');
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-file-pdf"></i> Download as PDF';
}

function gradeInfo(score) {
  if (score >= 70) return { g:'A', r:'Distinction', c:'grade-A' };
  if (score >= 60) return { g:'B', r:'Credit',      c:'grade-B' };
  if (score >= 50) return { g:'C', r:'Good',         c:'grade-C' };
  if (score >= 45) return { g:'D', r:'Fair',          c:'grade-D' };
  if (score >= 40) return { g:'E', r:'Pass',           c:'grade-E' };
  return                   { g:'F', r:'Fail',           c:'grade-F' };
}
