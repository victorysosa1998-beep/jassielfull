<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transcript — Jaasiel Education Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
/* ── Transcript document styles ── */
.transcript{background:#fff;color:#111;max-width:820px;margin:0 auto;border:2px solid #0B1A35;font-family:'DM Sans',sans-serif;font-size:.82rem}
.tr-header{background:#0B1A35;padding:20px 28px;display:flex;align-items:center;gap:16px}
.tr-logo{width:70px;height:70px;border-radius:50%;object-fit:contain;background:#0B1A35;border:2px solid #C9973A;flex-shrink:0}
.tr-school{flex:1;text-align:center}
.tr-school-name{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:900;color:#C9973A}
.tr-school-sub{font-size:.72rem;color:rgba(255,255,255,.6);margin:3px 0}
.tr-doc-title{font-size:.9rem;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.4);display:inline-block;padding:3px 20px;border-radius:3px;margin-top:6px}

.tr-student-info{background:#f5f5f5;padding:12px 20px;border-bottom:2px solid #0B1A35;display:grid;grid-template-columns:repeat(3,1fr);gap:6px 20px}
.tr-info-item{font-size:.8rem}
.tr-info-label{color:#666;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.tr-info-value{font-weight:700;color:#111}

.tr-term-block{border-bottom:1px solid #ccc}
.tr-term-header{background:#e8e8e8;padding:7px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ccc;flex-wrap:wrap;gap:6px}
.tr-term-title{font-weight:700;font-size:.85rem}
.tr-term-avg{font-size:.82rem;font-weight:700}

table.tr-table{width:100%;border-collapse:collapse;font-size:.78rem}
table.tr-table th{background:#f0f0f0;padding:6px 10px;text-align:center;font-size:.7rem;font-weight:700;text-transform:uppercase;border:1px solid #ccc}
table.tr-table th:first-child{text-align:left}
table.tr-table td{padding:6px 10px;border:1px solid #ddd}
table.tr-table td:not(:first-child){text-align:center;font-family:'DM Mono',monospace}
table.tr-table tr:hover td{background:#fafafa}
.grade-A{color:#15803d;font-weight:700} .grade-B{color:#1d4ed8;font-weight:700}
.grade-C{color:#b45309;font-weight:700} .grade-D{color:#c2410c;font-weight:700}
.grade-E,.grade-F{color:#dc2626;font-weight:700}

.tr-summary{background:#f5f5f5;padding:12px 20px;border-top:2px solid #0B1A35;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:.82rem}
.tr-sum-item{display:flex;flex-direction:column;gap:2px}
.tr-sum-label{font-size:.7rem;color:#666;text-transform:uppercase}
.tr-sum-value{font-weight:700;font-size:1rem;color:#0B1A35}
.tr-sum-value.gold{color:#C9973A}

.tr-sigs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding:16px 20px;border-top:1px solid #ccc}
.tr-sig-line{border-top:2px solid #555;padding-top:5px;font-size:.72rem;color:#555;text-align:center;margin-top:28px}

/* Print styles */
@media print {
  body { background:#fff!important }
  .page-bg,.sidebar,.topbar,.no-print,.sidebar-overlay { display:none!important }
  .main-content { margin:0!important }
  .page-body { padding:0!important }
  .transcript { border-radius:0; max-width:100%; border-left:none; border-right:none; }
}

/* Mobile */
@media(max-width:600px){
  .tr-student-info { grid-template-columns:1fr 1fr }
  .tr-summary { grid-template-columns:1fr 1fr }
  .tr-sigs { grid-template-columns:1fr 1fr }
  .tr-header { flex-direction:column; text-align:center; padding:14px }
  .tr-term-header { flex-direction:column; align-items:flex-start }
  .tr-table { font-size:.72rem }
  .tr-table th, .tr-table td { padding:4px 6px }
  .table-wrapper { overflow-x:auto; -webkit-overflow-scrolling:touch }
}
</style>
</head>
<body>
<div class="page-bg"></div>
<div class="page-loader" id="page-loader"><div class="loader-logo"><i class="fas fa-graduation-cap"></i> Jaasiel RMS</div><div class="loader-ring"></div></div>
<div class="toast-container" id="toast-container"></div>

<div class="app-layout">
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar"></aside>
<div class="main-content">

  <!-- Topbar — topbar-right injected by initPage, don't put buttons there -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
      <a href="my-results.html" class="btn btn-ghost btn-sm" style="padding:6px 12px"><i class="fas fa-arrow-left"></i></a>
      <div>
        <div class="page-title">Transcript</div>
        <div class="breadcrumb">
          <a href="student-dashboard.html">Dashboard</a><span class="sep">/</span>
          <a href="my-results.html">Results</a><span class="sep">/</span>
          <span class="text-gold">Transcript</span>
        </div>
      </div>
    </div>
    <div class="topbar-right" id="topbar-right"></div>
  </header>

  <div class="page-body">

    <!-- ── Filter card — in page body so initPage can't wipe it ── -->
    <div class="card mb-3 no-print" style="padding:18px 20px">
      <div style="font-weight:700;font-size:.9rem;margin-bottom:14px">
        <i class="fas fa-scroll" style="color:var(--brand-gold);margin-right:7px"></i>
        Generate Academic Transcript
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
        <div class="form-group mb-0">
          <label class="form-label">From Session</label>
          <select class="form-control" id="from-session">
            <option value="">All Sessions (Full History)</option>
          </select>
        </div>
        <div class="form-group mb-0">
          <label class="form-label">To Session</label>
          <select class="form-control" id="to-session">
            <option value="">Latest</option>
          </select>
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-primary" onclick="loadTranscript()">
          <i class="fas fa-scroll"></i> Generate Transcript
        </button>
        <button class="btn btn-ghost" onclick="clearFilter()">
          <i class="fas fa-rotate"></i> Full History
        </button>
        <div style="margin-left:auto;display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm no-print" onclick="window.print()">
            <i class="fas fa-print"></i> Print
          </button>
        </div>
      </div>
    </div>

    <!-- Transcript renders here -->
    <div id="transcript-container">
      <div style="text-align:center;padding:60px;color:var(--text-muted)">
        <i class="fas fa-scroll" style="font-size:2.5rem;display:block;margin-bottom:12px;opacity:.3"></i>
        Select a date range above and click <strong>Generate Transcript</strong>
      </div>
    </div>

  </div>
</div>
</div>

<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script>
let sessions = [], studentData = null;

document.addEventListener('DOMContentLoaded', async () => {
  await window.__rmsBootstrapReady;
  initPage('student', 'student');
  await Promise.all([loadSessions(), loadStudentInfo()]);
  // Auto-generate full history on page load
  loadTranscript();
});

/* ── Load sessions into selectors ── */
async function loadSessions() {
  try {
    const data = await API.sessions.list();
    sessions = data.items || [];
    ['from-session', 'to-session'].forEach(id => {
      const sel = document.getElementById(id);
      const isFrom = id === 'from-session';
      sel.innerHTML = `<option value="">${isFrom ? 'All Sessions (Full History)' : 'Latest'}</option>`;
      sessions.forEach(s => {
        const o = document.createElement('option');
        o.value = s.id;
        o.textContent = s.session_name;
        sel.appendChild(o);
      });
    });
  } catch(err) {
    console.error('Sessions load failed:', err);
  }
}

/* ── Load student profile ── */
async function loadStudentInfo() {
  try {
    studentData = await API.students.myProfile();
  } catch(err) {
    console.error('Student profile failed:', err);
  }
}

/* ── Clear filter and reload full history ── */
function clearFilter() {
  document.getElementById('from-session').value = '';
  document.getElementById('to-session').value   = '';
  loadTranscript();
}

/* ── Main: generate transcript ── */
async function loadTranscript() {
  if (!studentData) {
    Toast.error('Not ready', 'Student data not loaded yet. Please wait a moment and try again.');
    return;
  }

  const container = document.getElementById('transcript-container');
  container.innerHTML = `
    <div style="text-align:center;padding:48px">
      <div class="loader-ring" style="margin:0 auto;width:36px;height:36px;border-width:3px"></div>
      <div style="margin-top:12px;color:var(--text-muted);font-size:.85rem">Generating transcript…</div>
    </div>`;

  const fromSes = document.getElementById('from-session').value;
  const toSes   = document.getElementById('to-session').value;
  const params  = {};
  if (fromSes) params.from_session_id = fromSes;
  if (toSes)   params.to_session_id   = toSes;

  try {
    const data = await API.results.transcript(studentData.id, params);
    renderTranscript(data);
  } catch(err) {
    container.innerHTML = `
      <div class="alert alert-danger">
        <i class="fas fa-circle-exclamation"></i>
        ${Security.sanitize(err.message || 'Failed to load transcript. Please try again.')}
      </div>`;
  }
}

/* ── Render the transcript document ── */
function renderTranscript(data) {
  const terms = data.terms || [];

  // Build human-readable range label
  const rangeText = (() => {
    const fromSel = document.getElementById('from-session');
    const toSel   = document.getElementById('to-session');
    const fs = fromSel.options[fromSel.selectedIndex]?.text || '';
    const ts = toSel.options[toSel.selectedIndex]?.text   || '';
    if (!fromSel.value && !toSel.value) return 'Full Academic History';
    if (!fromSel.value) return `Up to ${ts}`;
    if (!toSel.value)   return `From ${fs} onwards`;
    return `${Security.sanitize(fs)} — ${Security.sanitize(ts)}`;
  })();

  // No results for range
  if (!terms.length) {
    document.getElementById('transcript-container').innerHTML = `
      <div class="transcript">
        <div class="tr-header">
          <img class="tr-logo" src="images/logo.png" alt="Jaasiel Logo" onerror="this.style.display='none'">
          <div class="tr-school">
            <div class="tr-school-name">JAASIEL EDUCATION CENTRE</div>
            <div class="tr-school-sub">By Oxygen House, Off Ovbieko Rod, Idokpa, Benin City</div>
            <div class="tr-doc-title">ACADEMIC TRANSCRIPT</div>
          </div>
          <img class="tr-logo" src="images/logo.png" alt="" onerror="this.style.display='none'">
        </div>
        <div style="padding:48px;text-align:center;color:#999">
          <i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:12px"></i>
          No published results found for: <strong>${rangeText}</strong><br>
          <span style="font-size:.82rem;margin-top:8px;display:block">Results must be published by admin before they appear on your transcript.</span>
        </div>
      </div>`;
    return;
  }

  document.getElementById('transcript-container').innerHTML = `
  <div class="transcript">

    <!-- Header -->
    <div class="tr-header">
      <img class="tr-logo" src="images/logo.png" alt="Jaasiel Logo" onerror="this.style.display='none'">
      <div class="tr-school">
        <div class="tr-school-name">JAASIEL EDUCATION CENTRE</div>
        <div class="tr-school-sub">By Oxygen House, Off Ovbieko Rod, Idokpa, Benin City</div>
        <div class="tr-doc-title">OFFICIAL ACADEMIC TRANSCRIPT</div>
      </div>
      <img class="tr-logo" src="images/logo.png" alt="" onerror="this.style.display='none'">
    </div>

    <!-- Student info -->
    <div class="tr-student-info">
      <div class="tr-info-item">
        <div class="tr-info-label">Student Name</div>
        <div class="tr-info-value">${Security.sanitize(data.full_name || '—')}</div>
      </div>
      <div class="tr-info-item">
        <div class="tr-info-label">Student ID</div>
        <div class="tr-info-value" style="font-family:'DM Mono',monospace">${Security.sanitize(data.student_no || '—')}</div>
      </div>
      <div class="tr-info-item">
        <div class="tr-info-label">Current Class</div>
        <div class="tr-info-value">${Security.sanitize(data.class_name || '—')}</div>
      </div>
      <div class="tr-info-item">
        <div class="tr-info-label">Period Covered</div>
        <div class="tr-info-value">${rangeText}</div>
      </div>
      <div class="tr-info-item">
        <div class="tr-info-label">Date Issued</div>
        <div class="tr-info-value">${new Date().toLocaleDateString('en-NG',{day:'2-digit',month:'long',year:'numeric'})}</div>
      </div>
      <div class="tr-info-item">
        <div class="tr-info-label">Overall Average</div>
        <div class="tr-info-value" style="color:#C9973A;font-size:1.05rem">${data.overall_avg || '—'}%</div>
      </div>
    </div>

    <!-- One block per term -->
    ${terms.map(term => {
      const gr = Fmt.grade(term.average);
      const isPass = term.average >= 40;
      return `
      <div class="tr-term-block">
        <div class="tr-term-header">
          <div class="tr-term-title">
            ${Security.sanitize(term.session_name)} — ${Security.sanitize(term.term_name)}
            <span style="font-weight:400;color:#777;font-size:.78rem;margin-left:6px">${Security.sanitize(term.class_name || '')}</span>
          </div>
          <div class="tr-term-avg" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <span>Avg: <strong class="grade-${gr.g}">${term.average}%</strong></span>
            <span>Total: <strong>${term.total_score}</strong></span>
            ${!term.is_ss && term.position
              ? `<span>Position: <strong>${Fmt.ordinal(term.position)}</strong></span>`
              : ''}
            <span style="color:${isPass?'#15803d':'#dc2626'};font-weight:700;padding:2px 10px;border-radius:12px;background:${isPass?'rgba(21,128,61,.1)':'rgba(220,38,38,.1)'};border:1px solid ${isPass?'rgba(21,128,61,.25)':'rgba(220,38,38,.25)'}">${isPass?'PASS':'FAIL'}</span>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="tr-table">
            <thead>
              <tr>
                <th style="text-align:left;min-width:140px">Subject</th>
                <th>1st CA<br>(20)</th>
                <th>2nd CA<br>(20)</th>
                <th>Exam<br>(60)</th>
                <th>Total<br>(100)</th>
                <th>Grade</th>
                <th>Remark</th>
              </tr>
            </thead>
            <tbody>
              ${term.results.map(r => {
                const rg = Fmt.grade(r.total_score || 0);
                const ca1 = r.ca_score != null ? Math.round(r.ca_score / 2) : '—';
                const ca2 = r.ca_score != null ? Math.ceil(r.ca_score / 2)  : '—';
                return `<tr>
                  <td style="font-weight:600;text-align:left">${Security.sanitize(r.subject_name || '—')}</td>
                  <td>${ca1}</td>
                  <td>${ca2}</td>
                  <td>${r.exam_score  ?? '—'}</td>
                  <td style="font-weight:700">${r.total_score ?? '—'}</td>
                  <td class="grade-${rg.g}">${rg.g}</td>
                  <td style="color:#666">${Security.sanitize(rg.r)}</td>
                </tr>`;
              }).join('')}
              <!-- Term summary row -->
              <tr style="background:#f0f0f0;font-weight:700;border-top:2px solid #ccc">
                <td style="text-align:left">TERM AVERAGE</td>
                <td colspan="3"></td>
                <td>${term.average}%</td>
                <td class="grade-${gr.g}">${gr.g}</td>
                <td style="color:#666">${Security.sanitize(gr.r)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>`;
    }).join('')}

    <!-- Overall summary -->
    <div class="tr-summary">
      <div class="tr-sum-item">
        <div class="tr-sum-label">Total Terms on Record</div>
        <div class="tr-sum-value">${data.total_terms}</div>
      </div>
      <div class="tr-sum-item">
        <div class="tr-sum-label">Overall Average</div>
        <div class="tr-sum-value gold">${data.overall_avg}%</div>
      </div>
      <div class="tr-sum-item">
        <div class="tr-sum-label">Overall Grade</div>
        <div class="tr-sum-value grade-${Fmt.grade(data.overall_avg).g}">
          ${Fmt.grade(data.overall_avg).g} — ${Security.sanitize(Fmt.grade(data.overall_avg).r)}
        </div>
      </div>
    </div>

    <!-- Signatures -->
    <div class="tr-sigs">
      <div><div class="tr-sig-line">Class Teacher's Signature</div></div>
      <div style="text-align:center">
        <img src="images/logo.png" style="width:52px;height:52px;border-radius:50%;object-fit:contain" alt="" onerror="this.style.display='none'">
        <div class="tr-sig-line">Official Stamp</div>
      </div>
      <div><div class="tr-sig-line">Principal / Director</div></div>
    </div>

    <!-- Footer -->
    <div style="padding:10px 20px;border-top:1px solid #ccc;background:#f9f9f9;text-align:center;font-size:.7rem;color:#777">
      This transcript is an official document issued by <strong>Jaasiel Education Centre</strong> · Idokpa, Benin City<br>
      Results are stored permanently and reflect official academic records · Issued: ${new Date().toLocaleDateString('en-NG',{day:'2-digit',month:'long',year:'numeric'})} · ${new Date().getFullYear()}
    </div>

  </div>`;
}
</script>
</body>
</html>
