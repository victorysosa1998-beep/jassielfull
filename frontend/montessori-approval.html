<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montessori Approvals — Jaasiel RMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="./css/style.css">
<style>
.filters-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.appr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.04);flex-wrap:wrap}
.appr-row:last-child{border-bottom:none}
.appr-name{font-weight:600;font-size:.92rem}
.appr-meta{font-size:.76rem;color:var(--text-muted);margin-top:2px}
.appr-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.badge-submitted{background:rgba(59,130,246,.12);color:#93C5FD}
.empty-state{text-align:center;padding:40px 16px;color:var(--text-muted)}
.rating-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:6px}
.rating-chip{font-size:.68rem;background:rgba(255,255,255,.04);border:1px solid var(--border-light);border-radius:6px;padding:4px 6px;display:flex;justify-content:space-between;gap:6px}
.rating-chip b{color:var(--brand-gold)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{background:var(--bg-card,#0F1C30);border:1px solid var(--border-light);border-radius:var(--radius,14px);max-width:640px;width:92%;max-height:86vh;overflow-y:auto;padding:22px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-title{font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.modal-close{cursor:pointer;color:var(--text-muted);font-size:1.1rem;background:none;border:none}
.cat-block{margin-bottom:14px}
.cat-block-title{font-weight:700;font-size:.85rem;color:var(--brand-gold);margin-bottom:4px}
</style>
</head>
<body>
<div class="page-bg"></div>
<div class="page-loader" id="page-loader"><div class="loader-logo"><i class="fas fa-graduation-cap"></i> Jaasiel RMS</div><div class="loader-ring"></div></div>
<div class="toast-container" id="toast-container"></div>
<div class="app-layout">
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar"></aside>
<div class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
      <div>
        <div class="page-title">Montessori Approvals</div>
        <div class="breadcrumb"><span class="text-gold">Admin</span><span class="sep">/</span><span>Montessori Approvals</span></div>
      </div>
    </div>
    <div class="topbar-right" id="topbar-right">
      <a href="montessori-history.html" class="btn btn-ghost btn-sm"><i class="fas fa-clock-rotate-left"></i> Full History</a>
    </div>
  </header>

  <div class="page-body">
    <div class="stats-grid mb-3" id="stats-grid">
      <div class="stat-card"><div class="stat-icon red"><i class="fas fa-clock"></i></div><div class="stat-info"><div class="stat-label">Awaiting Review</div><div class="stat-value" id="stat-pending">—</div></div></div>
      <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-info"><div class="stat-label">Approved (this term)</div><div class="stat-value" id="stat-approved">—</div></div></div>
      <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-rotate"></i></div><div class="stat-info"><div class="stat-label">Corrections Requested</div><div class="stat-value" id="stat-corrections">—</div></div></div>
    </div>

    <div class="card mb-3">
      <div class="filters-bar">
        <div class="form-group mb-0">
          <label class="form-label">Class</label>
          <select class="form-control" id="f-class"><option value="">All Montessori Classes</option></select>
        </div>
        <div class="form-group mb-0">
          <label class="form-label">Session</label>
          <select class="form-control" id="f-session"><option value="">Select…</option></select>
        </div>
        <div class="form-group mb-0">
          <label class="form-label">Term</label>
          <select class="form-control" id="f-term"><option value="">Select…</option></select>
        </div>
        <div class="form-group mb-0">
          <label class="form-label">Search Student</label>
          <input class="form-control" id="f-search" placeholder="Type a name…">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-header">
        <div>
          <div class="section-title">Submitted — Awaiting Approval</div>
          <div class="section-sub" id="list-sub">Loading…</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="loadPending()"><i class="fas fa-rotate"></i> Refresh</button>
      </div>
      <div id="pending-list">
        <div class="skeleton mb-2" style="height:74px;border-radius:12px"></div>
        <div class="skeleton mb-2" style="height:74px;border-radius:12px"></div>
        <div class="skeleton" style="height:74px;border-radius:12px"></div>
      </div>
      <div id="pending-pagination" class="mt-2"></div>
    </div>
  </div>
</div>
</div>

<!-- Review Modal -->
<div class="modal-overlay" id="modal-review">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="rm-title">Review Report</div>
      <button class="modal-close" onclick="Modal.close('modal-review')"><i class="fas fa-xmark"></i></button>
    </div>
    <div id="rm-body">Loading…</div>
    <div class="form-group" style="margin-top:14px">
      <label class="form-label">Note to Sub Admin (required for reject / correction)</label>
      <textarea class="form-control" id="rm-note" rows="3" placeholder="e.g. Please re-check the ratings for Social &amp; Emotional Development…"></textarea>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap">
      <button class="btn btn-danger" id="rm-reject-btn" onclick="doReject()"><i class="fas fa-times"></i> Reject</button>
      <button class="btn btn-warning" id="rm-correction-btn" onclick="doCorrection()"><i class="fas fa-rotate"></i> Request Correction</button>
      <button class="btn btn-success" id="rm-approve-btn" onclick="doApprove()"><i class="fas fa-check"></i> Approve</button>
    </div>
  </div>
</div>

<script src="./js/core.js"></script>
<script src="./js/ui.js"></script>
<script>
let _sessions = [], _page = 1, _perPage = 10, _items = [], _activeId = null;

document.addEventListener('DOMContentLoaded', async () => {
  await window.__rmsBootstrapReady;
  initPage(['super_admin','admin'], 'admin');
  await loadClasses();
  await loadSessions();
  wireFilters();
  await loadPending();
});

async function loadClasses() {
  document.getElementById('f-class').innerHTML = '<option value="">All Montessori Classes</option>' +
    MONTESSORI_CLASSES.map(c => `<option value="${c}">${c}</option>`).join('');
}

async function loadSessions() {
  try {
    const data = await API.sessions.list();
    _sessions = data.items || data || [];
    const sessSel = document.getElementById('f-session');
    sessSel.innerHTML = '<option value="">All Sessions</option>' + _sessions.map(s =>
      `<option value="${s.id}" ${s.is_current?'selected':''}>${s.session_name}</option>`).join('');
    populateTerms(sessSel.value);
  } catch(e) { console.warn(e); }
}

function populateTerms(sid) {
  const termSel = document.getElementById('f-term');
  const sess = _sessions.find(s => String(s.id) === String(sid));
  termSel.innerHTML = '<option value="">All Terms</option>' + (sess?.terms||[]).map(t =>
    `<option value="${t.id}" ${t.is_current?'selected':''}>${t.term_name}</option>`).join('');
}

function wireFilters() {
  document.getElementById('f-session').addEventListener('change', e => { populateTerms(e.target.value); _page = 1; loadPending(); });
  ['f-class','f-term'].forEach(id => document.getElementById(id).addEventListener('change', () => { _page = 1; loadPending(); }));
  let t;
  document.getElementById('f-search').addEventListener('input', () => {
    clearTimeout(t); t = setTimeout(() => { _page = 1; loadPending(); }, 350);
  });
}

async function loadPending() {
  const listEl = document.getElementById('pending-list');
  showSkeleton(listEl, 3, '74px');
  const params = {
    page: _page, per_page: _perPage,
    class_name: document.getElementById('f-class').value || undefined,
    session_id: document.getElementById('f-session').value || undefined,
    term_id: document.getElementById('f-term').value || undefined,
    search: document.getElementById('f-search').value || undefined,
  };
  try {
    const data = await API.montessori.pending(params);
    _items = data.items || data || [];
    const total = data.total ?? _items.length;
    document.getElementById('list-sub').textContent = `${total} submission${total===1?'':'s'} awaiting review`;
    document.getElementById('stat-pending').textContent = total;
    document.getElementById('stat-approved').textContent = Fmt.number(data.approved_count ?? '—');
    document.getElementById('stat-corrections').textContent = Fmt.number(data.correction_count ?? '—');
    renderList(_items);
    renderPagination(document.getElementById('pending-pagination'), {
      page: _page, total, perPage: _perPage,
      onChange: 'p => { _page = p; loadPending(); }'
    });
  } catch(err) {
    listEl.innerHTML = `<div class="empty-state"><i class="fas fa-triangle-exclamation" style="font-size:1.4rem;display:block;margin-bottom:8px"></i>Could not load submissions.<br><span style="font-size:.78rem">${Security.sanitize(err.message||'')}</span></div>`;
    document.getElementById('list-sub').textContent = '—';
    document.getElementById('stat-pending').textContent = '0';
  }
}

function renderList(items) {
  const el = document.getElementById('pending-list');
  if (!items.length) {
    el.innerHTML = `<div class="empty-state"><i class="fas fa-check-circle" style="font-size:1.6rem;display:block;margin-bottom:8px;color:var(--success)"></i>Nothing waiting on you — all caught up.</div>`;
    return;
  }
  el.innerHTML = items.map(r => {
    const ratedCount = Object.values(r.ratings || {}).reduce((n, cat) => n + Object.values(cat).filter(v => v).length, 0);
    return `<div class="appr-row">
      <div style="flex:1;min-width:220px">
        <div class="appr-name">${Security.sanitize(r.student_name || r.student?.full_name || 'Student #' + r.student_id)}</div>
        <div class="appr-meta">${Security.sanitize(r.class_name || r.class?.name || '—')} · ${Security.sanitize(r.session_name||'')} ${Security.sanitize(r.term_name||'')} · ${ratedCount} skill${ratedCount===1?'':'s'} rated · submitted ${Fmt.timeAgo(r.uploaded_at)}
          ${r.entered_by_name ? ' by ' + Security.sanitize(r.entered_by_name) : ''}</div>
      </div>
      <div class="appr-actions">
        <span class="badge badge-submitted"><i class="fas fa-paper-plane"></i> submitted</span>
        <button class="btn btn-sm btn-primary" onclick="openReview(${r.id})"><i class="fas fa-eye"></i> Review</button>
      </div>
    </div>`;
  }).join('');
}

function openReview(id) {
  const r = _items.find(x => x.id === id);
  if (!r) return;
  _activeId = id;
  document.getElementById('rm-title').textContent = `${r.student_name || r.student?.full_name || 'Student #' + r.student_id} — ${r.term_name || ''}`;
  document.getElementById('rm-note').value = '';

  const catsHtml = Object.entries(r.ratings || {}).map(([cat, items]) => `
    <div class="cat-block">
      <div class="cat-block-title">${Security.sanitize(cat)}</div>
      <div class="rating-summary">
        ${Object.entries(items).map(([item, val]) => `<div class="rating-chip"><span>${Security.sanitize(item)}</span><b>${val ?? '—'}</b></div>`).join('')}
      </div>
    </div>`).join('') || '<div class="empty-state" style="padding:16px">No ratings recorded.</div>';

  document.getElementById('rm-body').innerHTML = `
    ${catsHtml}
    <div class="cat-block">
      <div class="cat-block-title">Comments</div>
      <div style="font-size:.85rem;color:var(--text-secondary);line-height:1.5">
        <div><strong>Creative Expression:</strong> ${Security.sanitize(r.creative_expression_comment || '—')}</div>
        <div style="margin-top:6px"><strong>General Comment:</strong> ${Security.sanitize(r.general_comment || '—')}</div>
        <div style="margin-top:6px"><strong>Teacher:</strong> ${Security.sanitize(r.class_teacher_name || '—')} · <strong>Report:</strong> ${Security.sanitize(r.class_teacher_report || '—')}</div>
        <div style="margin-top:6px"><strong>Conduct:</strong> ${Security.sanitize(r.pupils_conduct || '—')} · <strong>Proprietor:</strong> ${Security.sanitize(r.proprietors_report || '—')}</div>
      </div>
    </div>`;
  Modal.open('modal-review');
}

async function doApprove() {
  if (!_activeId) return;
  const btn = document.getElementById('rm-approve-btn');
  setLoading(btn, true);
  try {
    await API.montessori.approve(_activeId);
    Toast.success('Approved', 'Montessori report approved.');
    Modal.close('modal-review');
    await loadPending();
  } catch(err) { Toast.error('Failed', err.message); }
  setLoading(btn, false);
}

async function doReject() {
  if (!_activeId) return;
  const note = document.getElementById('rm-note').value.trim();
  if (!note) { Toast.warning('Note required', 'Please explain why this report is being rejected.'); return; }
  const btn = document.getElementById('rm-reject-btn');
  setLoading(btn, true);
  try {
    await API.montessori.reject(_activeId, { reason: note });
    Toast.warning('Rejected', 'Sent back to the sub admin.');
    Modal.close('modal-review');
    await loadPending();
  } catch(err) { Toast.error('Failed', err.message); }
  setLoading(btn, false);
}

async function doCorrection() {
  if (!_activeId) return;
  const note = document.getElementById('rm-note').value.trim();
  if (!note) { Toast.warning('Note required', 'Please describe what needs correcting.'); return; }
  const btn = document.getElementById('rm-correction-btn');
  setLoading(btn, true);
  try {
    await API.montessori.correction(_activeId, { reason: note });
    Toast.info('Correction requested', 'Sub admin has been notified.');
    Modal.close('modal-review');
    await loadPending();
  } catch(err) { Toast.error('Failed', err.message); }
  setLoading(btn, false);
}
</script>
</body>
</html>
