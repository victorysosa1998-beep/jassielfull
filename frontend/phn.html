<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert</title>

<style>
    :root {
        --monzo-red: #ff4d4d;
        --monzo-dark: #1c1c1c;
        --monzo-grey: #6b7280;
        --monzo-light: #f6f6f6;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background: white;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* HEADER */
    .header {
        padding: 18px 16px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid #eee;
    }

    .back {
        font-size: 20px;
        margin-right: 14px;
        cursor: pointer;
        color: var(--monzo-dark);
    }

    .title {
        font-weight: 700;
        font-size: 16px;
        color: var(--monzo-dark);
    }

    .subtitle {
        font-size: 12px;
        color: var(--monzo-grey);
        margin-top: 2px;
    }

    /* CONTENT */
    .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
    }

    .icon {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: rgba(255, 77, 77, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        color: var(--monzo-red);
        margin-bottom: 18px;
    }

    h1 {
        font-size: 20px;
        font-weight: 700;
        color: var(--monzo-dark);
        margin-bottom: 10px;
    }

    p {
        font-size: 14px;
        color: var(--monzo-grey);
        line-height: 1.6;
        max-width: 320px;
    }

    .warning-box {
        margin-top: 16px;
        padding: 12px;
        border-radius: 10px;
        background: #fff5f5;
        border: 1px solid #ffd6d6;
        font-size: 13px;
        color: var(--monzo-red);
        max-width: 320px;
    }

    /* FOOTER */
    .footer {
        padding: 16px;
        border-top: 1px solid #eee;
    }

    .btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        margin-bottom: 10px;
    }

    .btn-primary {
        background: var(--monzo-red);
        color: white;
    }

    .btn-secondary {
        background: #f3f4f6;
        color: var(--monzo-dark);
    }

    .balance {
        font-size: 12px;
        color: var(--monzo-grey);
    }
</style>
</head>

<body>

<div class="header">
    <div class="back">←</div>
    <div>
        <div class="title">Payment review</div>
        <div class="subtitle">Balance £3,390</div>
    </div>
</div>

<div class="content">

    <div class="icon">⚠️</div>

    <h1>Something doesn’t match</h1>

    <p>
        The recipient name doesn’t match the account details provided.
        This payment may not be going where you expect.
    </p>

    <div class="warning-box">
        Only continue if you personally know and trust this recipient.
        Scammers often use mismatched details.
    </div>

</div>

<div class="footer">
    <button class="btn btn-primary">Cancel and go back</button>
    <button class="btn btn-secondary">Continue anyway</button>
</div>

</body>
</html>
