<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=780, initial-scale=0.45, minimum-scale=0.3, maximum-scale=5, user-scalable=yes">
<title>Report Card — Jaasiel Education Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="./css/style.css">
<style>
.rc-page {
  background: #fff;
  color: #1a1a2e;
  width: 780px;
  min-width: 780px;
  margin: 0 auto;
  font-family: 'DM Sans', sans-serif;
  font-size: 10.5px;
  border: 3px double #002060;
  position: relative;
}
.rc-page::before {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(0,32,96,.15);
  pointer-events: none;
  z-index: 0;
}
.rc-head {
  padding: 0;
  border-bottom: 3px solid #002060;
  position: relative;
  z-index: 1;
  background: linear-gradient(180deg, #f0f4ff 0%, #fff 100%);
}
.rc-head-top {
  background: linear-gradient(135deg, #002060 0%, #0a3d8f 50%, #1a56c8 100%);
  height: 7px;
}
.rc-head-inner {
  display: flex;
  align-items: center;
  padding: 12px 18px 10px;
  gap: 14px;
}
.rc-logo {
  width: 72px;
  height: 72px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 2px solid rgba(0,32,96,.2);
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,32,96,.15);
  background: #fff;
}
.rc-logo img { width: 100%; height: 100%; object-fit: contain; }
.rc-school-info { flex: 1; text-align: center; }
.rc-school-name {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  font-weight: 900;
  color: #002060;
  letter-spacing: .5px;
  line-height: 1.1;
  text-transform: uppercase;
}
.rc-school-sub { font-size: 9px; color: #444; margin: 2px 0; font-style: italic; }
.rc-school-contact { font-size: 8.5px; color: #1a56c8; margin: 2px 0; }
.rc-motto {
  font-family: 'Playfair Display', serif;
  font-size: 10px;
  font-weight: 700;
  color: #b8860b;
  margin-top: 3px;
  text-transform: uppercase;
  letter-spacing: .8px;
}
.rc-photo-box {
  width: 72px;
  height: 85px;
  border: 1.5px solid #002060;
  background: #f8f9ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .6rem;
  color: #999;
  flex-shrink: 0;
  overflow: hidden;
  border-radius: 4px;
}
.rc-photo-box img { width: 100%; height: 100%; object-fit: cover; }
.rc-title-bar {
  background: linear-gradient(135deg, #002060, #1a56c8);
  color: #ffd700;
  text-align: center;
  padding: 6px;
  font-family: 'Playfair Display', serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  border-bottom: 2px solid #002060;
  position: relative;
  z-index: 1;
}
.rc-title-bar::before, .rc-title-bar::after {
  content: '✦';
  position: absolute;
  top: 50%; transform: translateY(-50%);
  font-size: 10px;
  color: rgba(255,215,0,.6);
}
.rc-title-bar::before { left: 16px; }
.rc-title-bar::after  { right: 16px; }
.rc-info-section {
  border-bottom: 1.5px solid #002060;
  position: relative;
  z-index: 1;
}
.rc-row {
  display: flex;
  border-bottom: 1px solid #c5d0e8;
}
.rc-row:last-child { border-bottom: none; }
.rc-cell {
  padding: 3px 8px;
  border-right: 1px solid #c5d0e8;
  display: flex;
  align-items: center;
  gap: 5px;
  min-height: 22px;
  flex: 1;
}
.rc-cell:last-child { border-right: none; }
.rc-cell.double { flex: 2; }
.rc-cell.triple { flex: 3; }
.rc-lbl {
  font-size: 8.5px;
  font-weight: 700;
  text-transform: uppercase;
  color: #002060;
  white-space: nowrap;
  flex-shrink: 0;
  letter-spacing: .3px;
}
.rc-val {
  font-family: 'Source Serif 4', serif;
  font-size: 10.5px;
  font-weight: 600;
  color: #000;
  border-bottom: 1px solid #000;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
  min-width: 40px;
  padding-bottom: 0;
}
.rc-stats-row {
  display: flex;
  background: linear-gradient(135deg, #f0f4ff, #e8eeff);
  border-bottom: 2px solid #002060;
  position: relative;
  z-index: 1;
}
.rc-stat-cell {
  flex: 1;
  padding: 5px 8px;
  border-right: 1px solid #c5d0e8;
  display: flex;
  align-items: center;
  gap: 5px;
}
.rc-stat-cell:last-child { border-right: none; }
.rc-stat-val {
  font-family: 'Playfair Display', serif;
  font-size: 14px;
  font-weight: 900;
  color: #002060;
}
.rc-section-head {
  background: linear-gradient(135deg, #002060, #1a56c8);
  color: #ffd700;
  text-align: center;
  padding: 4px;
  font-family: 'Playfair Display', serif;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  position: relative;
  z-index: 1;
}
.rc-scores-wrapper {
  display: block;
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.rc-scores {
  width: 100%;
  border-collapse: collapse;
  font-size: 10px;
  position: relative;
  z-index: 1;
}
.rc-scores thead th {
  background: linear-gradient(180deg, #1a3a8f, #002060);
  color: #ffd700;
  padding: 5px 6px;
  text-align: center;
  border: 1px solid #002060;
  font-family: 'DM Sans', sans-serif;
  font-size: 8.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .3px;
}
.rc-scores thead th.left { text-align: left; }
.rc-scores tbody td {
  padding: 3.5px 6px;
  border: 1px solid #dde3f0;
  text-align: center;
  font-size: 10px;
  vertical-align: middle;
}
.rc-scores tbody td.left {
  text-align: left;
  font-family: 'Source Serif 4', serif;
  font-weight: 600;
  font-size: 10.5px;
}
.rc-scores tbody tr:nth-child(even) td { background: #f5f8ff; }
.rc-scores tbody tr:hover td { background: #eef2ff; }
.rc-scores tfoot td {
  background: linear-gradient(135deg, #002060, #1a3a8f);
  color: #ffd700;
  font-weight: 700;
  padding: 5px 6px;
  border: 1px solid #002060;
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: 11px;
}
.rc-scores tfoot td.left { text-align: right; color: rgba(255,215,0,.8); font-size: 9px; font-family: 'DM Sans'; text-transform: uppercase; letter-spacing: .5px; }
.grade-A  { color: #15803d; font-weight: 800; }
.grade-B  { color: #1d4ed8; font-weight: 800; }
.grade-C  { color: #b45309; font-weight: 800; }
.grade-D  { color: #ea580c; font-weight: 800; }
.grade-E  { color: #dc2626; font-weight: 800; }
.grade-F  { color: #b91c1c; font-weight: 800; }
.grade-Ap { color: #0f6b2c; font-weight: 800; }
.rc-lower {
  display: grid;
  grid-template-columns: 1.1fr 1fr 1fr;
  border-top: 2px solid #002060;
  position: relative;
  z-index: 1;
}
.rc-lower-col {
  border-right: 1px solid #c5d0e8;
}
.rc-lower-col:last-child { border-right: none; }
.rc-lower-head {
  background: linear-gradient(135deg, #002060, #1a3a8f);
  color: #ffd700;
  padding: 4px 8px;
  font-family: 'Playfair Display', serif;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  text-align: center;
}
.rc-lower-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 9.5px;
}
.rc-lower-table td {
  padding: 2.5px 7px;
  border-bottom: 1px solid #eee;
}
.rc-lower-table tr:nth-child(even) td { background: #f8faff; }
.rc-keys-head {
  font-size: 8.5px;
  font-weight: 700;
  color: #c00;
  text-align: center;
  padding: 3px;
  background: #fff8f8;
  border-bottom: 1px solid #fcc;
  font-family: 'DM Sans', sans-serif;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.rc-keys-row {
  padding: 2px 7px;
  font-size: 9px;
  border-bottom: 1px solid #f0f0f0;
  line-height: 1.4;
}
.rc-bill-row {
  display: flex;
  justify-content: space-between;
  padding: 2.5px 7px;
  border-bottom: 1px solid #eee;
  font-size: 9.5px;
}
.rc-bill-row.total {
  font-weight: 700;
  border-top: 1.5px solid #002060;
  background: linear-gradient(135deg, #f0f4ff, #e8eeff);
  font-size: 10px;
}
.rc-footer {
  border-top: 2px solid #002060;
  padding: 8px 14px;
  position: relative;
  z-index: 1;
  background: #fafbff;
}
.rc-comment-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 5px;
}
.rc-comment-lbl {
  font-size: 8.5px;
  font-weight: 700;
  color: #002060;
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
  letter-spacing: .3px;
}
.rc-comment-line {
  flex: 1;
  border-bottom: 1px solid #666;
  font-family: 'Source Serif 4', serif;
  font-size: 10px;
  padding-bottom: 1px;
  min-width: 80px;
  line-height: 1.3;
  color: #222;
}
.rc-next-bar {
  display: flex;
  gap: 24px;
  align-items: center;
  padding: 5px 14px;
  background: linear-gradient(135deg, #fffde7, #fff9c4);
  border-top: 1px solid #f0c000;
  border-bottom: 1px solid #f0c000;
  position: relative;
  z-index: 1;
}
.rc-next-item { display: flex; align-items: center; gap: 5px; }
.rc-next-lbl { font-size: 8.5px; font-weight: 700; color: #7a6000; text-transform: uppercase; }
.rc-next-val { font-family: 'Source Serif 4', serif; font-size: 10.5px; font-weight: 700; color: #3a2c00; }
.rc-sig-area {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 8px 14px 6px;
  gap: 16px;
  border-top: 1px solid #c5d0e8;
  background: #fafbff;
  position: relative;
  z-index: 1;
}
.rc-sig-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  flex: 1;
}
.rc-sig-lbl {
  font-size: 8px;
  font-weight: 700;
  color: #002060;
  text-transform: uppercase;
  letter-spacing: .4px;
}
.rc-sig-val {
  font-family: 'Playfair Display', serif;
  font-size: 11px;
  font-weight: 700;
  color: #002060;
  border-bottom: 1px solid #002060;
  min-width: 140px;
  text-align: center;
  padding-bottom: 1px;
  font-style: italic;
}
.rc-stamp-wrap { width: 100px; height: 100px; flex-shrink: 0; }
.rc-stamp-img { width: 100px; height: 100px; object-fit: contain; mix-blend-mode: multiply; opacity: .85; }
.rc-fine-print {
  text-align: center;
  padding: 3px;
  font-size: 7.5px;
  color: #aaa;
  border-top: 1px solid #dde;
  background: #fafbff;
  position: relative;
  z-index: 1;
}

/* Back banner */
.rc-back-banner {
  background: linear-gradient(135deg,rgba(201,151,58,.10),rgba(28,53,100,.15));
  border: 1px solid rgba(201,151,58,.25);
  border-radius: 12px;
  padding: 12px 18px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.rc-back-banner-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: .95rem;
  color: var(--brand-gold);
}
.rc-back-banner-sub {
  font-size: .78rem;
  color: var(--text-muted);
  margin-top: 2px;
}

@media screen {
  .rc-page {
    box-shadow: 0 12px 60px rgba(0,32,96,.2), 0 2px 8px rgba(0,0,0,.08);
    border-radius: 4px;
    overflow: hidden;
  }
}
@media (max-width: 820px) {
  .page-body { padding: 8px 0 16px !important; }
  .topbar { padding: 0 10px; height: 60px; gap: 8px; }
  .topbar-left { gap: 6px; }
  .topbar-right {
    flex-wrap: nowrap;
    gap: 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
    max-width: calc(100% - 140px);
  }
  .topbar-right .filter-select {
    font-size: .72rem;
    min-width: 100px;
    max-width: 130px;
    flex-shrink: 0;
  }
  .breadcrumb { display: none; }
  .session-pill { display: none; }
  .page-title { font-size: .85rem; max-width: 130px; }
}
@media print {
  body { background: #fff !important; }
  .page-bg, .sidebar, .topbar, .toast-container, .page-loader, .btn, .no-print, .rc-back-banner { display: none !important; }
  .main-content { margin-left: 0 !important; }
  .rc-page { box-shadow: none; border: 3px double #002060; max-width: 100%; width: 100%; min-width: unset; border-radius: 0; }
  .page-body { padding: 0 !important; }
}

/* ── Long-press download overlay ── */
#rc-hold-wrapper {
  position: relative;
  display: inline-block;
  width: 100%;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#rc-hold-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0, 32, 96, 0.55);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  z-index: 100;
  border-radius: 4px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  animation: overlayFadeIn 0.2s ease;
}
#rc-hold-overlay.visible {
  display: flex;
}
@keyframes overlayFadeIn {
  from { opacity: 0; transform: scale(0.97); }
  to   { opacity: 1; transform: scale(1); }
}
#rc-download-btn {
  background: linear-gradient(135deg, #ffd700, #f0b800);
  color: #002060;
  border: none;
  border-radius: 50px;
  padding: 14px 32px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  transition: transform 0.15s, box-shadow 0.15s;
  letter-spacing: 0.3px;
}
#rc-download-btn:hover {
  transform: scale(1.04);
  box-shadow: 0 6px 28px rgba(0,0,0,0.4);
}
#rc-download-btn i { font-size: 18px; }
#rc-overlay-hint {
  color: rgba(255,255,255,0.8);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  text-align: center;
}
#rc-hold-progress {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: rgba(255, 215, 0, 0);
  border-radius: 0 0 4px 4px;
  overflow: hidden;
  pointer-events: none;
}
#rc-hold-progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ffd700, #f0b800);
  transition: width linear;
  border-radius: 0 0 4px 4px;
}
#rc-download-toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #002060;
  color: #ffd700;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  padding: 12px 24px;
  border-radius: 50px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  z-index: 9999;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  white-space: nowrap;
}
#rc-download-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>
<div class="page-bg"></div>
<div class="page-loader" id="page-loader"><div class="loader-logo"><i class="fas fa-graduation-cap"></i> Jaasiel RMS</div><div class="loader-ring"></div></div>
<div class="toast-container" id="toast-container"></div>
<div class="app-layout">
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar"></aside>
<div class="main-content">
  <header class="topbar no-print">
    <div class="topbar-left">
      <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
      <div>
        <div class="page-title">Report Card</div>
        <div class="breadcrumb">
          <a href="student-dashboard.html">Dashboard</a>
          <span class="sep">/</span>
          <a href="my-results.html">Results</a>
          <span class="sep">/</span>
          <span class="text-gold">Report Card</span>
        </div>
      </div>
    </div>
    <div class="topbar-right no-print" style="display:flex;gap:8px;align-items:center;">
      <button class="btn btn-secondary btn-sm" id="btn-back" onclick="goBack()" style="display:none">
        <i class="fas fa-arrow-left"></i> <span class="no-mobile">Back to Results</span>
      </button>
      <select class="filter-select" id="session-sel" style="font-size:.82rem;min-width:0;flex:1;max-width:150px"></select>
      <select class="filter-select" id="term-sel" style="font-size:.82rem;min-width:0;flex:1;max-width:130px"></select>
      <button class="btn btn-primary btn-sm" onclick="window.print()"><i class="fas fa-print"></i> <span class="no-mobile">Print</span></button>
    </div>
  </header>
  <div class="page-body" style="padding:16px">

    <!-- Back / context banner — shown only when arrived from my-results -->
    <div class="rc-back-banner no-print" id="back-banner" style="display:none">
      <div>
        <div class="rc-back-banner-title" id="banner-title">Report Card</div>
        <div class="rc-back-banner-sub">Viewing specific term result. Use the dropdowns above to switch, or go back to see all results.</div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> Back to My Results
      </button>
    </div>

    <div id="rc-hold-wrapper">
      <div id="rc-hold-progress"><div id="rc-hold-progress-bar"></div></div>
      <div id="rc-hold-overlay">
        <div id="rc-overlay-hint">Report card ready to save</div>
        <button id="rc-download-btn" onclick="downloadReportCard()">
          <i class="fas fa-download"></i> Download Image
        </button>
        <div style="color:rgba(255,255,255,0.5);font-family:'DM Sans',sans-serif;font-size:11px;margin-top:2px">Tap anywhere else to dismiss</div>
      </div>
      <div id="card-container">
        <div class="rc-page" style="padding:40px;text-align:center;color:#666"><div style="font-size:2rem;margin-bottom:12px">🎓</div>Loading report card…</div>
      </div>
    </div>
    <div id="rc-download-toast">✓ Report card saved to your device</div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="./js/core.js"></script>
<script src="./js/ui.js"></script>
<script>
const LOGO_SRC  = './images/logo.png';
const STAMP_SRC = 'images/schoolstamp.png';

/* ── Read URL params (set when navigating from my-results.html) ── */
const _urlParams    = new URLSearchParams(window.location.search);
const _paramSession = _urlParams.get('session_id');
const _paramTerm    = _urlParams.get('term_id');

/* ── Back navigation ── */
function goBack() {
  if (document.referrer && document.referrer.includes('my-results')) {
    history.back();
  } else {
    window.location.href = 'my-results.html';
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  await window.__rmsBootstrapReady;
  initPage('student', 'student');

  /* Show back button + banner only when URL has session/term params */
  if (_paramSession || _paramTerm) {
    const backBtn = document.getElementById('btn-back');
    if (backBtn) backBtn.style.display = '';
    const banner = document.getElementById('back-banner');
    if (banner) banner.style.display = '';
  }

  await loadSessions();
  loadCard();
});

/* ── Populate session + term dropdowns ── */
async function loadSessions() {
  try {
    const data = await API.students.mySessions();
    const sessions = data.items || [];
    const sessSel  = document.getElementById('session-sel');
    const termSel  = document.getElementById('term-sel');

    sessSel.innerHTML = '<option value="">All Sessions</option>';
    sessions.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.session_name;
      if (s.is_current) o.selected = true;
      sessSel.appendChild(o);
    });

    const _populateTerms = (sid) => {
      termSel.innerHTML = '<option value="">All Terms</option>';
      const sess = sessions.find(s => String(s.id) === String(sid));
      if (sess && sess.terms) {
        sess.terms.forEach(t => {
          const o = document.createElement('option');
          o.value = t.id; o.textContent = t.term_name;
          if (t.is_current) o.selected = true;
          termSel.appendChild(o);
        });
      }
    };

    /* If URL params exist, force-select them */
    if (_paramSession) {
      sessSel.value = _paramSession;
    }
    _populateTerms(sessSel.value);
    if (_paramTerm) {
      termSel.value = _paramTerm;
    }

    /* Update banner title once we know the session+term names */
    if (_paramSession || _paramTerm) {
      const selOpt  = sessSel.options[sessSel.selectedIndex];
      const termOpt = termSel.options[termSel.selectedIndex];
      const sName   = selOpt  ? selOpt.textContent  : '';
      const tName   = termOpt ? termOpt.textContent  : '';
      const bannerTitle = document.getElementById('banner-title');
      if (bannerTitle && (sName || tName)) {
        bannerTitle.textContent = [tName, sName].filter(Boolean).join(' — ');
      }
    }

    sessSel.addEventListener('change', () => {
      _populateTerms(sessSel.value);
      loadCard();
    });
    termSel.addEventListener('change', () => loadCard());

  } catch(e) {
    const s = document.getElementById('session-sel');
    if (s) s.innerHTML = '<option value="">Current Session</option>';
  }
}

/* ─────────────────────────────────────────────────────────────────────────
   GRADE SYSTEM
   70–100 = A  |  60–69 = B  |  50–59 = C
   45–49  = D  |  40–44 = E  |  0–39  = F
   Special: 100 exactly = A+ (bonus display only, still grade A tier)
   ───────────────────────────────────────────────────────────────────────── */
function gradeInfo(score) {
  const s = parseFloat(score);
  if (isNaN(s)) return { g: '—', r: '—', c: '' };
  if (s === 100)  return { g: 'A+', r: 'Distinction', c: 'grade-A' };
  if (s >= 70)    return { g: 'A',  r: 'Distinction', c: 'grade-A' };
  if (s >= 60)    return { g: 'B',  r: 'Credit',      c: 'grade-B' };
  if (s >= 50)    return { g: 'C',  r: 'Good',        c: 'grade-C' };
  if (s >= 45)    return { g: 'D',  r: 'Fair',        c: 'grade-D' };
  if (s >= 40)    return { g: 'E',  r: 'Pass',        c: 'grade-E' };
  return               { g: 'F',  r: 'Fail',        c: 'grade-F' };
}

/* ─────────────────────────────────────────────────────────────────────────
   SUBJECT VALIDITY CHECK
   A subject is "scored" only when it has at least an exam score.
   Blank subjects, empty rows, unoffered subjects, subjects without
   test/exam entries are IGNORED and must NOT affect totals or averages.
   ───────────────────────────────────────────────────────────────────────── */
function isValidScore(v) {
  return v !== null && v !== undefined && v !== '';
}

function computeSubjectTotal(r) {
  /* If backend already computed and stored total_score, use it */
  if (isValidScore(r.total_score)) return parseFloat(r.total_score);

  /* Exam score is mandatory — without it the subject is unscored */
  if (!isValidScore(r.exam_score)) return null;

  const exam  = parseFloat(r.exam_score)  || 0;
  const hasT1 = isValidScore(r.first_test);
  const hasT2 = isValidScore(r.second_test);
  const hasCA = isValidScore(r.ca_score);

  /* Subject Total = Test1 + Test2 + Exam (preferred breakdown) */
  if (hasT1 || hasT2) {
    const t1 = hasT1 ? (parseFloat(r.first_test)  || 0) : 0;
    const t2 = hasT2 ? (parseFloat(r.second_test) || 0) : 0;
    return t1 + t2 + exam;
  }

  /* Fallback: CA + Exam (when school uses continuous assessment lump sum) */
  if (hasCA) return (parseFloat(r.ca_score) || 0) + exam;

  /* Exam-only subject */
  return exam;
}

/* ─────────────────────────────────────────────────────────────────────────
   POSITION RULES
   • Creche / Nursery / Primary / Basic / JSS1–JSS3 → show position
   • SS1 / SS2 / SS3 → position field stays blank
   ───────────────────────────────────────────────────────────────────────── */
function shouldShowPosition(className) {
  if (!className) return true; // default: show
  const cn = className.trim().toUpperCase();
  /* Match SS1, SS2, SS3 (Senior Secondary) */
  if (/^SS\s*[123]$/.test(cn)) return false;
  return true;
}

/* ─────────────────────────────────────────────────────────────────────────
   PASS / FAIL STATUS
   Student passes if average >= 40 (grade E threshold)
   ───────────────────────────────────────────────────────────────────────── */
function passFailStatus(avg) {
  return avg >= 40 ? 'PASS' : 'FAIL';
}

/* ── Render the full report card HTML ── */
function renderCard(data, results) {
  if (!results || !results.length) results = data.results || [];

  /* ── Filter to only valid (scored) subjects ── */
  const scored        = results.filter(r => computeSubjectTotal(r) !== null);
  const subjectTotals = scored.map(r => computeSubjectTotal(r));

  /* ── Overall totals ── */
  const scoredCount  = scored.length;
  const overallTotal = subjectTotals.reduce((a, b) => a + b, 0);

  /*
   * Obtainable Score = Number of Scored Subjects × 100
   * e.g. 15 subjects → 1500
   */
  const obtainable   = scoredCount * 100;

  /*
   * Average = Total Score ÷ Number of Scored Subjects
   * NOT (Total ÷ Obtainable) × 100
   */
  const avg          = scoredCount ? overallTotal / scoredCount : 0;

  /* ── Pass/Fail ── */
  const passFail = passFailStatus(avg);

  /* ── Position (blank for SS classes) ── */
  const showPos    = shouldShowPosition(data.class_name);
  const posDisplay = showPos ? Fmt.ordinal(data.position || '—') : '—';

  /* ── Overall grade based on average ── */
  const gl = gradeInfo(avg);

  /* ── Attendance (per-student) ── */
  const timesOpen    = data.attendance   || (results.length ? Math.max(...results.map(r => r.attendance    || 0)) : 0);
  const timesPresent = data.days_present || (results.length ? Math.max(...results.map(r => r.days_present  || 0)) : 0) || timesOpen;
  const timesAbsent  = data.days_absent  || (results.length ? Math.max(...results.map(r => r.days_absent   || 0)) : 0);

  /* ─────────────────────────────────────────────────────────────────────────
     AUTO-GENERATED COMMENTS
     Priority: use backend-stored comment if provided, else auto-generate
     based on the student's actual performance this term.
     ─────────────────────────────────────────────────────────────────────── */

  /* ── Find the subject with the lowest total (to name in principal remark) ── */
  let weakestSubject = null;
  let weakestScore   = Infinity;
  scored.forEach((r, idx) => {
    const t = subjectTotals[idx];
    if (t !== null && t < weakestScore) {
      weakestScore   = t;
      weakestSubject = r.subject_name || null;

  /* ── Teacher Comment: based on average ── */
  function autoTeacherComment(avg) {
    if (avg >= 70) return 'Excellent performance.';
    if (avg >= 50) return 'Good results, work harder next term.';
    return 'Weak results, put more effort next term.';
  }

  /* ── Principal Remark: based on average + weakest subject ── */
  function autoPrincipalRemark(avg, weakSub) {
    if (avg >= 70) return 'Excellent, keep it up.';
    if (avg >= 50) return 'Satisfactory.';
    if (avg >= 40) return 'Work harder next term.';
    return weakSub

  /* Use backend value if supplied, otherwise auto-generate */
  const teacherCmt = results.find(r => r.teacher_comment)?.teacher_comment

  /* ── Determine if 1st/2nd test columns are needed ── */

(function () {
  const HOLD_MS   = 600;   // ms to hold before overlay appears
  const wrapper   = document.getElementById('rc-hold-wrapper');
  const overlay   = document.getElementById('rc-hold-overlay');
  const progressBar = document.getElementById('rc-hold-progress-bar');
  let holdTimer   = null;
  let progTimer   = null;

  function showOverlay() {
    overlay.classList.add('visible');
    progressBar.style.transition = 'none';
    progressBar.style.width = '0%';
  }

  function hideOverlay() {
    overlay.classList.remove('visible');
    progressBar.style.transition = 'none';
    progressBar.style.width = '0%';
  }

  function startHold() {
    progressBar.style.transition = 'none';
    progressBar.style.width = '0%';
    // Force reflow then animate
    requestAnimationFrame(() => {
      progressBar.style.transition = `width ${HOLD_MS}ms linear`;
      progressBar.style.width = '100%';
    });
    holdTimer = setTimeout(showOverlay, HOLD_MS);
  }

  function cancelHold() {
    clearTimeout(holdTimer);
    holdTimer = null;
    progressBar.style.transition = 'width 0.2s ease';
    progressBar.style.width = '0%';
  }

  // Touch events (mobile)
  wrapper.addEventListener('touchstart', (e) => {
    // Don't trigger if tapping the overlay buttons
    if (e.target.closest('#rc-hold-overlay')) return;
    startHold();
  }, { passive: true });

  wrapper.addEventListener('touchend',    cancelHold, { passive: true });
  wrapper.addEventListener('touchcancel', cancelHold, { passive: true });
  wrapper.addEventListener('touchmove',   cancelHold, { passive: true });

  // Mouse events (desktop)
  wrapper.addEventListener('mousedown', (e) => {
    if (e.target.closest('#rc-hold-overlay')) return;
    startHold();
  });
  window.addEventListener('mouseup', cancelHold);

  // Dismiss overlay when clicking outside overlay buttons
  overlay.addEventListener('click', (e) => {
    if (!e.target.closest('#rc-download-btn')) {
      hideOverlay();
    }
  });
})();

/* ── Download report card as image ── */
async function downloadReportCard() {
  const btn = document.getElementById('rc-download-btn');
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating…';
  btn.disabled = true;

  try {
    const card = document.querySelector('#card-container .rc-page');
    if (!card) throw new Error('Card not found');

    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff',
      logging: false,
      onclone: (doc) => {
        // Ensure the cloned page is fully visible
        const clonedCard = doc.querySelector('#card-container .rc-page');
        if (clonedCard) {
          clonedCard.style.boxShadow = 'none';
          clonedCard.style.borderRadius = '0';
        }
      }
    });

    // Build filename from student name if available
    const nameEl = card.querySelector('.rc-val');
    const studentName = nameEl ? nameEl.textContent.trim().replace(/\s+/g, '_') : 'student';
    const filename = `Report_Card_${studentName}_${Date.now()}.png`;

    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png', 1.0);
    link.click();

    // Show success toast
    const toast = document.getElementById('rc-download-toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);

    // Close overlay
    document.getElementById('rc-hold-overlay').classList.remove('visible');

  } catch (err) {
    console.error('Download failed:', err);
    alert('Could not generate image. Please try the Print button instead.');
  } finally {
    btn.innerHTML = '<i class="fas fa-download"></i> Download Image';
    btn.disabled = false;
  }
}
</script>
