<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password — Jaasiel RMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="page-bg"></div>
<div class="page-loader" id="page-loader"><div class="loader-logo"><i class="fas fa-graduation-cap"></i> Jaasiel RMS</div><div class="loader-ring"></div></div>
<div class="toast-container" id="toast-container"></div>
<div class="app-layout">
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar"></aside>
<div class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
      <div><div class="page-title">Change Password</div><div class="breadcrumb"><a href="student-dashboard.html">Dashboard</a><span class="sep">/</span><span class="text-gold">Change Password</span></div></div>
    </div>
    <div class="topbar-right" id="topbar-right"></div>
  </header>
  <div class="page-body">
    <div style="max-width:480px;margin:0 auto">
      <div class="card">
        <div class="ai-card mb-3">
          <div style="font-size:.85rem;color:var(--text-secondary)"><i class="fas fa-shield-check" style="color:var(--success);margin-right:6px"></i>Your password was auto-generated when you were registered. Please change it to something only you know.</div>
        </div>
        <form id="pwd-form" onsubmit="changePassword(event)">
          <div class="form-group"><label class="form-label">Current Password <span class="required">*</span></label>
            <div class="input-group"><i class="input-icon fas fa-lock"></i><input type="password" class="form-control" id="pwd-current" data-validate="required" placeholder="Your current password"><span class="input-addon-right" onclick="togglePwd('pwd-current',this)"><i class="fas fa-eye"></i></span></div>
            <div class="form-hint">Default: DDMMYY (e.g. if born 20 April 1999 → 200499)</div>
          </div>
          <div class="form-group"><label class="form-label">New Password <span class="required">*</span></label>
            <div class="input-group"><i class="input-icon fas fa-lock"></i><input type="password" class="form-control" id="pwd-new" data-validate="required|minLen:6" placeholder="Min 6 characters"><span class="input-addon-right" onclick="togglePwd('pwd-new',this)"><i class="fas fa-eye"></i></span></div></div>
          <div class="form-group"><label class="form-label">Confirm New Password <span class="required">*</span></label>
            <div class="input-group"><i class="input-icon fas fa-lock"></i><input type="password" class="form-control" id="pwd-confirm" data-validate="required|match:pwd-new" placeholder="Repeat new password"><span class="input-addon-right" onclick="togglePwd('pwd-confirm',this)"><i class="fas fa-eye"></i></span></div></div>
          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center" id="change-btn"><i class="fas fa-key"></i> Change Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
</div>
<script src="./js/core.js"></script>
<script src="./js/ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded',async()=>{await window.__rmsBootstrapReady;initPage('student','student');});
async function changePassword(e){e.preventDefault();if(!Validator.validate(document.getElementById('pwd-form')))return;const btn=document.getElementById('change-btn');setLoading(btn,true,'Changing…');try{await API.students.myChangePwd({current_password:document.getElementById('pwd-current').value,new_password:document.getElementById('pwd-new').value});Toast.success('Password Changed!','Your new password is active');document.getElementById('pwd-form').reset();}catch(err){Toast.error('Failed',err.message);}setLoading(btn,false);}
</script>
</body>
</html>
