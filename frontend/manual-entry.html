<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manual Score Entry — Jaasiel RMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="./css/style.css">
<style>
.score-table{width:100%;border-collapse:collapse;font-size:.88rem}
.score-table th{padding:12px 16px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border-light);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);white-space:nowrap}
.score-table td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.score-table tr:last-child td{border-bottom:none}
.score-table tr:hover td{background:rgba(255,255,255,.02)}
.s-input{width:70px;background:var(--bg-input);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:7px 10px;color:var(--text-primary);font-size:.88rem;text-align:center;outline:none;font-family:var(--font-mono);transition:var(--transition)}
.s-input:focus{border-color:var(--brand-gold);background:rgba(201,151,58,.05)}
.s-input.over{border-color:var(--danger);color:var(--danger)}
.grade-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;font-size:.78rem;font-weight:700}
</style>
</head>
<body>
<div class="page-bg"></div>
<div class="page-loader" id="page-loader"><div class="loader-logo"><i class="fas fa-graduation-cap"></i> Jaasiel RMS</div><div class="loader-ring"></div></div>
<div class="toast-container" id="toast-container"></div>
<div class="app-layout">
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar"></aside>
<div class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
      <div>
        <div class="page-title">Manual Score Entry</div>
        <div class="breadcrumb"><a href="subadmin-dashboard.html">Dashboard</a><span class="sep">/</span><span class="text-gold">Manual Entry</span></div>
      </div>
    </div>
    <div class="topbar-right" id="topbar-right"></div>
  </header>
  <div class="page-body">
    <!-- Context Selection -->
    <div class="card mb-3">
      <div style="font-weight:700;margin-bottom:16px"><i class="fas fa-sliders" style="color:var(--brand-gold);margin-right:8px"></i>Select Context</div>
      <div class="grid-2" style="gap:16px;margin-bottom:16px">
        <div class="form-group mb-0">
          <label class="form-label">Class <span class="required">*</span></label>
          <select class="form-control" id="sel-class" onchange="onClassChange()"><option value="">Select class…</option></select>
        </div>
        <div class="form-group mb-0">
          <label class="form-label">Subject <span class="required">*</span></label>
          <select class="form-control" id="sel-subject" disabled><option value="">Select subject…</option></select>
        </div>
        <div class="form-group mb-0">
          <label class="form-label">Session <span class="required">*</span></label>
          <select class="form-control" id="sel-session" onchange="loadTermsFor()"><option value="">Select session…</option></select>
        </div>
        <div class="form-group mb-0">
          <label class="form-label">Term <span class="required">*</span></label>
          <select class="form-control" id="sel-term" disabled><option value="">Select term…</option></select>
        </div>
      </div>
      <button class="btn btn-primary" onclick="loadStudents()"><i class="fas fa-users"></i> Load Students</button>
    </div>

    <!-- Score Entry Grid (hidden until loaded) -->
    <div id="entry-section" class="hidden">
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px">
          <div>
            <div style="font-family:var(--font-display);font-size:1.1rem;font-weight:700" id="entry-heading">Score Entry</div>
            <div style="font-size:.8rem;color:var(--text-muted);margin-top:3px" id="entry-sub"></div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <div style="font-size:.8rem;color:var(--text-muted);display:flex;align-items:center;gap:8px">
              <span>1st Test: <strong class="text-gold" id="ca-max-label">20</strong></span>
              <span>2nd Test: <strong class="text-gold" id="exam-max-label">20</strong></span>
            </div>
            <label style="display:flex;align-items:center;gap:6px;font-size:.82rem;cursor:pointer;color:var(--text-secondary)">
              <input type="checkbox" id="no-test-mode" style="accent-color:var(--brand-gold)" onchange="toggleNoTestMode()">
              <span>No test (enter total/100 directly)</span>
            </label>
            <div style="display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--text-secondary);flex-wrap:wrap">
              <label style="font-weight:600;white-space:nowrap">Days School Opened:</label>
              <input type="number" id="days-school-opened" class="form-control" placeholder="e.g. 96" min="1" max="200"
                style="width:80px;padding:5px 8px;font-size:.82rem;height:auto">
              <label style="font-weight:600;white-space:nowrap;margin-left:8px">Days Present:</label>
              <input type="number" id="days-present" class="form-control" placeholder="e.g. 90" min="0" max="200"
                style="width:80px;padding:5px 8px;font-size:.82rem;height:auto"
                title="Days the student was present (can be set per student or as a default)">
              <label style="font-weight:600;white-space:nowrap;margin-left:8px">Days Absent:</label>
              <input type="number" id="days-absent" class="form-control" placeholder="e.g. 6" min="0" max="200"
                style="width:80px;padding:5px 8px;font-size:.82rem;height:auto"
                title="Auto-calculated: Days Opened − Days Present">
            </div>
            <button class="btn btn-ghost btn-sm" onclick="clearAll()"><i class="fas fa-eraser"></i> Clear All</button>
            <button class="btn btn-secondary" id="review-scores-btn" onclick="reviewScores()"><i class="fas fa-eye"></i> Review Scores</button>
            <button class="btn btn-primary" id="submit-scores-btn" onclick="submitScores()" style="display:none"><i class="fas fa-paper-plane"></i> Confirm &amp; Submit</button>
          </div>
        </div>


        <div style="overflow-x:auto">
          <table class="score-table" id="score-table">
            <thead>
              <tr>
                <th>#</th><th>Student Name</th><th>ID</th>
                <th id="th-first-test">1st Test <span style="font-weight:400;color:var(--text-muted)">(max 20)</span></th>
                <th id="th-second-test">2nd Test <span style="font-weight:400;color:var(--text-muted)">(max 20)</span></th>
                <th>Exam Score <span style="font-weight:400;color:var(--text-muted)">(max <span id="exam-max-th">60</span>)</span></th>
                <th>Total</th><th>Grade</th><th>Remark</th>
                <th>Teacher's Comment</th>
              </tr>
            </thead>
            <tbody id="score-tbody"></tbody>
          </table>
        </div>
        <div id="validation-panel" class="hidden" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border-light)">
          <div style="font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px"><i class="fas fa-robot" style="color:#C084FC"></i> AI Validation Report</div>
          <div id="validation-items"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
<script src="./js/core.js"></script>
<script src="./js/ui.js"></script>
<script>
const FIRST_MAX = 20, SECOND_MAX = 20, EXAM_MAX = 60, TOTAL_MAX = 100;
let students = [], classId = null, noTestMode = false;
let _lastSavedBatchId = null;

document.addEventListener('DOMContentLoaded', async () => {
  await window.__rmsBootstrapReady;
  initPage('sub_admin', 'subadmin');
  populateClassSelect(document.getElementById('sel-class'), 'Select class…', false);
  loadSessions();

  // Auto-calculate days absent when present or opened changes
  ['days-school-opened','days-present'].forEach(id => {
    document.getElementById(id)?.addEventListener('input', () => {
      const opened  = parseInt(document.getElementById('days-school-opened')?.value) || 0;
      const present = parseInt(document.getElementById('days-present')?.value);
      if (!isNaN(present) && opened > 0) {
        document.getElementById('days-absent').value = Math.max(0, opened - present);
      }
    });
  });
});

async function loadSessions() {
  try {
    const data = await API.sessions.list();
    const items = data.items || data || [];
    const sel = document.getElementById('sel-session');
    sel.innerHTML = '<option value="">Select session…</option>';
    items.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.session_name + (s.is_current ? ' ★' : '');
      if (s.is_current) o.selected = true;
      sel.appendChild(o);
    });
    // Auto-load terms for current session
    if (sel.value) loadTermsFor();
  } catch(e) { console.warn('loadSessions error', e); }
}
async function loadTermsFor() {
  const sid = document.getElementById('sel-session').value;
  const sel = document.getElementById('sel-term');
  sel.innerHTML = '<option value="">Loading…</option>'; sel.disabled = true;
  if (!sid) { sel.innerHTML = '<option value="">Select term…</option>'; return; }
  try {
    const data = await API.sessions.terms(sid);
    const items = data.items || data || [];
    sel.innerHTML = '<option value="">Select term…</option>';
    items.forEach(t => {
      const o = document.createElement('option');
      o.value = t.id; o.textContent = t.term_name + (t.is_current ? ' ★' : '');
      if (t.is_current) o.selected = true;
      sel.appendChild(o);
    });
    sel.disabled = false;
  } catch { sel.innerHTML = '<option value="">Error loading terms</option>'; }
}
async function onClassChange() {
  const cls = document.getElementById('sel-class').value;
  const sel = document.getElementById('sel-subject'); sel.innerHTML='<option value="">Loading…</option>'; sel.disabled=true;
  if (!cls) { sel.innerHTML='<option value="">Select subject…</option>'; return; }
  try {
    const data = await API.classes.list();
    const clsObj = (data.items||data||[]).find(c=>c.name===cls||c.id===cls);
    if (clsObj) { classId=clsObj.id; const subs=await API.classes.subjects(clsObj.id); sel.innerHTML='<option value="">Select subject…</option>'; (subs.items||subs||[]).forEach(s=>{const o=document.createElement('option');o.value=s.id||s.name;o.textContent=s.name;sel.appendChild(o);}); }
    sel.disabled=false;
  } catch { sel.innerHTML='<option value="">Error</option>'; sel.disabled=false; }
}

async function loadStudents() {
  const cls = document.getElementById('sel-class').value;
  const sub = document.getElementById('sel-subject').value;
  const ses = document.getElementById('sel-session').value;
  const trm = document.getElementById('sel-term').value;
  if (!cls||!sub||!ses||!trm) { Toast.warning('Incomplete','Please select all fields.'); return; }
  document.getElementById('entry-section').classList.remove('hidden');
  const clsText = document.getElementById('sel-class').options[document.getElementById('sel-class').selectedIndex].text;
  const subText = document.getElementById('sel-subject').options[document.getElementById('sel-subject').selectedIndex].text;
  document.getElementById('entry-heading').textContent = `${clsText} — ${subText}`;
  const tbody = document.getElementById('score-tbody');
  tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px"><div class="loader-ring" style="margin:0 auto;width:28px;height:28px;border-width:2px"></div></td></tr>';
  try {
    const data = await API.classes.students(classId||cls);
    students = data.items||data||[];
    // Also try to load existing scores for this context
    let existing = {};
    try {
      const ex = await API.results.list({ class_name:cls, subject_id:sub, session_id:ses, term_id:trm });
      (ex.items||ex||[]).forEach(r => { existing[r.student_id] = r; });
    } catch {}
    renderScoreGrid(students, existing);
    document.getElementById('entry-sub').textContent = `${students.length} students loaded`;
  } catch {
    // Demo students
    students = Array.from({length:10},(_,i)=>({id:`stu${i}`,full_name:`Student ${String.fromCharCode(65+i)} Lastname`,student_id:`STU-100${i}`}));
    renderScoreGrid(students, {});
    document.getElementById('entry-sub').textContent = `${students.length} students loaded`;
  }
}

function toggleNoTestMode() {
  noTestMode = document.getElementById('no-test-mode').checked;
  document.getElementById('th-first-test').style.display = noTestMode ? 'none' : '';
  document.getElementById('th-second-test').style.display = noTestMode ? 'none' : '';
  document.getElementById('exam-max-th').textContent = noTestMode ? '100' : '60';
  if (students.length) renderScoreGrid(students, {});
}

function renderScoreGrid(studs, existing) {
  const tbody = document.getElementById('score-tbody');
  tbody.innerHTML = studs.map((s,i) => {
    const ex = existing[s.id]||existing[s.student_id]||{};
    const ft = ex.first_test??''; const st = ex.second_test??''; const exam = ex.exam_score??'';
    const total = !noTestMode
      ? (ft!==''&&exam!=='' ? (parseFloat(ft)||0)+(parseFloat(st)||0)+(parseFloat(exam)||0) : '')
      : (exam!=='' ? parseFloat(exam)||0 : '');
    const gr = total!=='' ? Fmt.grade(total) : null;
    return `<tr id="row-${i}">
      <td style="color:var(--text-muted);font-size:.8rem">${i+1}</td>
      <td><strong>${Security.sanitize(s.full_name)}</strong></td>
      <td class="font-mono" style="font-size:.8rem;color:var(--text-muted)">${s.student_id||'—'}</td>
      ${!noTestMode ? `
      <td><input class="s-input" type="number" id="ft-${i}" min="0" max="${FIRST_MAX}" value="${ft}" placeholder="—" oninput="calcRow(${i})"></td>
      <td><input class="s-input" type="number" id="st-${i}" min="0" max="${SECOND_MAX}" value="${st}" placeholder="—" oninput="calcRow(${i})"></td>
      ` : '<td style="display:none"></td><td style="display:none"></td>'}
      <td><input class="s-input" type="number" id="exam-${i}" min="0" max="${noTestMode?TOTAL_MAX:EXAM_MAX}" value="${exam}" placeholder="—" oninput="calcRow(${i})"></td>
      <td class="font-mono" style="font-weight:700" id="total-${i}">${total!==''?total:'—'}</td>
      <td id="grade-${i}">${gr?`<span class="grade-badge" style="background:${Fmt.gradeColor(gr.g)}22;color:${Fmt.gradeColor(gr.g)};border:1px solid ${Fmt.gradeColor(gr.g)}44">${gr.g}</span>`:'—'}</td>
      <td id="remark-${i}" style="font-size:.82rem;color:var(--text-secondary)">${gr?gr.r:'—'}</td>
      <td><input class="s-input" type="text" id="tc-${i}" placeholder="Optional remark…" style="width:130px;text-align:left;font-family:var(--font-sans)"></td>
    </tr>`;
  }).join('');
}

function calcRow(idx) {
  const ftEl = document.getElementById('ft-'+idx);
  const stEl = document.getElementById('st-'+idx);
  const examEl = document.getElementById('exam-'+idx);
  const ft = ftEl ? (parseFloat(ftEl.value)||0) : 0;
  const st = stEl ? (parseFloat(stEl.value)||0) : 0;
  const exam = parseFloat(examEl.value)||0;
  if (ftEl) ftEl.classList.toggle('over', ft>FIRST_MAX);
  if (stEl) stEl.classList.toggle('over', st>SECOND_MAX);
  examEl.classList.toggle('over', noTestMode ? exam>TOTAL_MAX : exam>EXAM_MAX);
  const total = noTestMode ? exam : (ft+st+exam);
  document.getElementById('total-'+idx).textContent = (ft>0||st>0||exam>0) ? total : '—';
  const gr = (ft>0||st>0||exam>0) ? Fmt.grade(total) : null;
  document.getElementById('grade-'+idx).innerHTML = gr ? `<span class="grade-badge" style="background:${Fmt.gradeColor(gr.g)}22;color:${Fmt.gradeColor(gr.g)};border:1px solid ${Fmt.gradeColor(gr.g)}44">${gr.g}</span>` : '—';
  document.getElementById('remark-'+idx).textContent = gr?gr.r:'—';
}

function clearAll() {
  students.forEach((_,i) => {
    const ftEl=document.getElementById('ft-'+i); if(ftEl) ftEl.value='';
    const stEl=document.getElementById('st-'+i); if(stEl) stEl.value='';
    const exEl=document.getElementById('exam-'+i); if(exEl) exEl.value='';
    document.getElementById('total-'+i).textContent='—';
    document.getElementById('grade-'+i).innerHTML='—';
    document.getElementById('remark-'+i).textContent='—';
  });
  document.getElementById('validation-panel').classList.add('hidden');
}

function reviewScores() {
  const cls = document.getElementById('sel-class').value;
  const sub = document.getElementById('sel-subject').value;
  const ses = document.getElementById('sel-session').value;
  const trm = document.getElementById('sel-term').value;
  if (!cls||!sub||!ses||!trm) { Toast.warning('Incomplete','Please select all fields.'); return; }

  // Count filled rows
  let filled = 0;
  students.forEach((s,i) => {
    const examEl = document.getElementById('exam-'+i);
    const exam = examEl ? parseFloat(examEl.value) : NaN;
    if (!isNaN(exam) && exam >= 0) filled++;
  });
  if (filled === 0) { Toast.warning('No scores','Please enter at least one score before reviewing.'); return; }

  // Save as draft first, then show review modal
  _saveDraftAndReview();
}

async function _saveDraftAndReview() {
  const btn = document.getElementById('review-scores-btn');
  setLoading(btn, true, 'Saving draft…');
  try {
    const rows = _buildRows();
    if (!rows.length) { Toast.warning('No scores','Enter at least one score.'); return; }

    const daysOpened  = parseInt(document.getElementById('days-school-opened')?.value)||null;
    const daysPresent = parseInt(document.getElementById('days-present')?.value)||null;
    const daysAbsent  = parseInt(document.getElementById('days-absent')?.value)||null;
    if (daysOpened)  rows.forEach(r => r.attendance   = daysOpened);
    if (daysPresent) rows.forEach(r => r.days_present = daysPresent);
    if (daysAbsent)  rows.forEach(r => r.days_absent  = daysAbsent);

    const result = await API.results.upload({
      class_name: document.getElementById('sel-class').value,
      subject_id: document.getElementById('sel-subject').value,
      session_id: document.getElementById('sel-session').value,
      term_id:    document.getElementById('sel-term').value,
      source: 'manual', no_test: noTestMode, scores: rows,
    });
    _lastSavedBatchId = result.batch_id;
    Toast.success('Draft saved', `${result.created} scores saved as draft.`);
    _showReviewModal(rows);
  } catch(err) {
    Toast.error('Save failed', err.message);
  } finally {
    setLoading(btn, false);
  }
}

function _buildRows() {
  return students.map((s,i) => {
    const ftEl   = document.getElementById('ft-'+i);
    const stEl   = document.getElementById('st-'+i);
    const examEl = document.getElementById('exam-'+i);
    const tcEl   = document.getElementById('tc-'+i);
    const ft   = ftEl   ? parseFloat(ftEl.value)   : NaN;
    const st   = stEl   ? parseFloat(stEl.value)   : NaN;
    const exam = examEl ? parseFloat(examEl.value) : NaN;
    const tc   = tcEl   ? tcEl.value.trim() : '';
    if (noTestMode) {
      if (isNaN(exam)) return null;
      if (exam > TOTAL_MAX) return null;
      return { student_id: s.id||s.student_id, exam_score: exam, total_score: exam, teacher_comment: tc||null };
    }
    if ((isNaN(ft) && isNaN(st)) || isNaN(exam)) return null;
    const firstT  = isNaN(ft) ? null : ft;
    const secondT = isNaN(st) ? null : st;
    const ca = (firstT||0) + (secondT||0);
    if (ca > 40 || exam > EXAM_MAX) return null;
    return { student_id: s.id||s.student_id, first_test: firstT, second_test: secondT,
             ca_score: ca, exam_score: exam, total_score: ca+exam, teacher_comment: tc||null };
  }).filter(Boolean);
}

function _showReviewModal(rows) {
  const clsText = document.getElementById('sel-class').selectedOptions[0]?.text || '';
  const subText = document.getElementById('sel-subject').selectedOptions[0]?.text || '';
  const sesText = document.getElementById('sel-session').selectedOptions[0]?.text || '';
  const trmText = document.getElementById('sel-term').selectedOptions[0]?.text || '';
  const missing = students.length - rows.length;

  // Build student map for names
  const studentMap = {};
  students.forEach(s => { studentMap[s.id||s.student_id] = s.full_name; });

  const hasBreak = rows.some(r => r.first_test != null || r.second_test != null);

  document.getElementById('review-modal-title').textContent = `Review: ${clsText} — ${subText}`;
  document.getElementById('review-modal-sub').textContent   = `${sesText} · ${trmText} · ${rows.length} students scored`;

  document.getElementById('review-modal-body').innerHTML = `
    ${missing > 0 ? `<div class="alert alert-warning mb-3">
      <i class="fas fa-triangle-exclamation"></i>
      <strong>${missing} student(s) have no score entered</strong> and will be skipped.
    </div>` : `<div class="alert alert-success mb-3">
      <i class="fas fa-check-circle"></i> All ${rows.length} students have scores entered.
    </div>`}
    <div style="overflow-x:auto">
      <table class="table" style="font-size:.83rem">
        <thead><tr>
          <th>#</th><th>Student</th>
          ${hasBreak ? '<th style="text-align:center">1st Test</th><th style="text-align:center">2nd Test</th>' : ''}
          <th style="text-align:center">Exam</th>
          <th style="text-align:center">Total</th>
          <th style="text-align:center">Grade</th>
          <th>Remark</th>
        </tr></thead>
        <tbody>
          ${rows.map((r, i) => {
            const total = r.total_score ?? ((r.ca_score||0) + (r.exam_score||0));
            const gr  = Fmt.grade(total);
            const gc  = Fmt.gradeColor(gr.g);
            const name = studentMap[r.student_id] || r.student_id;
            return `<tr>
              <td style="color:var(--text-muted)">${i+1}</td>
              <td><strong>${Security.sanitize(name)}</strong></td>
              ${hasBreak ? `<td style="text-align:center;font-family:var(--font-mono)">${r.first_test??'—'}</td>
                            <td style="text-align:center;font-family:var(--font-mono)">${r.second_test??'—'}</td>` : ''}
              <td style="text-align:center;font-family:var(--font-mono)">${r.exam_score??'—'}</td>
              <td style="text-align:center;font-family:var(--font-mono);font-weight:700">${total}</td>
              <td style="text-align:center">
                <span style="display:inline-flex;align-items:center;justify-content:center;
                  width:26px;height:26px;border-radius:6px;font-weight:800;font-size:.75rem;
                  background:${gc}22;color:${gc};border:1px solid ${gc}40">${gr.g}</span>
              </td>
              <td style="color:var(--text-secondary);font-size:.82rem">${gr.r}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;

  Modal.open('modal-review');
}

async function confirmAndSaveDraft() {
  // Draft already saved — just close modal and redirect to upload history
  Modal.close('modal-review');
  Toast.success('Draft saved!', 'Go to Upload History to review all classes and submit to admin when ready.');
  setTimeout(() => window.location.href = 'upload-history.html', 1200);
}

async function submitScores() {
  // This button now only appears after review — it submits the draft to admin
  const btn = document.getElementById('submit-scores-btn');
  setLoading(btn, true, 'Submitting…');
  try {
    const rows = _buildRows();
    if (!rows.length) { Toast.warning('No scores','Enter scores before submitting.'); return; }

    const daysOpened  = parseInt(document.getElementById('days-school-opened')?.value)||null;
    const daysPresent = parseInt(document.getElementById('days-present')?.value)||null;
    const daysAbsent  = parseInt(document.getElementById('days-absent')?.value)||null;
    if (daysOpened)  rows.forEach(r => r.attendance   = daysOpened);
    if (daysPresent) rows.forEach(r => r.days_present = daysPresent);
    if (daysAbsent)  rows.forEach(r => r.days_absent  = daysAbsent);

    await API.results.upload({
      class_name: document.getElementById('sel-class').value,
      subject_id: document.getElementById('sel-subject').value,
      session_id: document.getElementById('sel-session').value,
      term_id:    document.getElementById('sel-term').value,
      source: 'manual', no_test: noTestMode, scores: rows,
    });
    Toast.success('Saved!', 'Scores saved as draft. Go to Upload History to submit to admin.');
    setTimeout(() => window.location.href='upload-history.html', 1400);
  } catch(err) { Toast.error('Failed', err.message); setLoading(btn, false); }
}
</script>
