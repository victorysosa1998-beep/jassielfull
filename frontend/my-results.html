<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Results — Jaasiel RMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-bg"></div>
<div class="page-loader" id="page-loader"><div class="loader-logo"><i class="fas fa-graduation-cap"></i> Jaasiel RMS</div><div class="loader-ring"></div></div>
<div class="toast-container" id="toast-container"></div>
<div class="app-layout">
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar"></aside>
<div class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
      <a href="student-dashboard.html" class="btn btn-ghost btn-sm" style="padding:6px 12px"><i class="fas fa-arrow-left"></i></a>
      <div><div class="page-title">All My Results</div><div class="breadcrumb"><a href="student-dashboard.html">Dashboard</a><span class="sep">/</span><span class="text-gold">Results</span></div></div>
    </div>
    <div class="topbar-right" id="topbar-right">
      <a href="report-card.html" class="btn btn-primary btn-sm"><i class="fas fa-file-pdf"></i> Report Card</a>
    </div>
  </header>
  <div class="page-body">
    <div class="filter-bar mb-3">
      <select class="filter-select" id="session-filter" onchange="loadAll()"><option value="">All Sessions</option></select>
      <select class="filter-select" id="term-filter" onchange="loadAll()"><option value="">All Terms</option></select>
    </div>
    <div id="results-by-term"></div>
  </div>
</div>
</div>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded',async()=>{await window.__rmsBootstrapReady;initPage('student','student');loadSessions();loadAll();});
async function loadSessions(){try{const d=await API.sessions.list();const sel=document.getElementById('session-filter');(d.items||d||[]).forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.session_name;sel.appendChild(o);});}catch{}}
async function loadAll(){
  const container=document.getElementById('results-by-term');
  showSkeleton(container,3,'120px','14px');
  try{
    const params={};const sid=document.getElementById('session-filter').value;if(sid)params.session_id=sid;
    const data=await API.students.myResults(params);
    const grouped=groupByTerm(data.results||data.items||data||[],data);
    container.innerHTML=Object.entries(grouped).map(([key,{termName,sessionName,results}])=>{
      const avgs=results.map(r=>r.total_score||0);const avg=avgs.length?(avgs.reduce((a,b)=>a+b,0)/avgs.length):0;
      return`<div class="card mb-3"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px"><div><div style="font-family:var(--font-display);font-weight:700;font-size:1rem">${termName}</div><div style="font-size:.78rem;color:var(--text-muted)">${sessionName}</div></div><div style="display:flex;gap:8px;align-items:center"><span style="font-family:var(--font-mono);font-size:1.2rem;font-weight:900;color:var(--brand-gold)">${avg.toFixed(1)}</span><span class="badge ${Fmt.grade(avg).bg}">${Fmt.grade(avg).g}</span><a href="report-card.html" class="btn btn-sm btn-ghost"><i class="fas fa-download"></i></a></div></div>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem"><thead><tr style="border-bottom:1px solid var(--border-light)">${['Subject','CA','Exam','Total','Grade','Remarks'].map(h=>`<th style="padding:8px 12px;text-align:${h==='Subject'?'left':'center'};font-size:.72rem;color:var(--text-muted);text-transform:uppercase">${h}</th>`).join('')}</tr></thead><tbody>${results.map(r=>{const gr=Fmt.grade(r.total_score||0);return`<tr style="border-bottom:1px solid rgba(255,255,255,.04)"><td style="padding:9px 12px;font-weight:600">${r.subject_name||'—'}</td><td style="padding:9px 12px;text-align:center;font-family:var(--font-mono)">${r.ca_score??'—'}</td><td style="padding:9px 12px;text-align:center;font-family:var(--font-mono)">${r.exam_score??'—'}</td><td style="padding:9px 12px;text-align:center;font-family:var(--font-mono);font-weight:700">${r.total_score??'—'}</td><td style="padding:9px 12px;text-align:center"><span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;font-weight:700;font-size:.8rem;background:${Fmt.gradeColor(gr.g)}22;color:${Fmt.gradeColor(gr.g)};border:1px solid ${Fmt.gradeColor(gr.g)}44">${gr.g}</span></td><td style="padding:9px 12px;color:var(--text-secondary);font-size:.82rem">${gr.r}</td></tr>`;}).join('')}</tbody></table></div></div>`;
    }).join('')||'<div class="card" style="text-align:center;padding:48px;color:var(--text-muted)"><i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:12px"></i>No results found</div>';
  }catch{
    const demoTerms=[{term:'First Term 2024/2025',results:[{subject_name:'Mathematics',ca_score:35,exam_score:52,total_score:87},{subject_name:'English Language',ca_score:30,exam_score:48,total_score:78},{subject_name:'Basic Science',ca_score:28,exam_score:44,total_score:72}]},{term:'Second Term 2024/2025',results:[{subject_name:'Mathematics',ca_score:38,exam_score:55,total_score:93},{subject_name:'English Language',ca_score:32,exam_score:50,total_score:82},{subject_name:'Basic Science',ca_score:30,exam_score:48,total_score:78}]}];
    container.innerHTML=demoTerms.map(({term,results})=>{const avgs=results.map(r=>r.total_score);const avg=avgs.reduce((a,b)=>a+b,0)/avgs.length;return`<div class="card mb-3"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px"><div style="font-family:var(--font-display);font-weight:700;font-size:1rem">${term}</div><div style="display:flex;gap:8px;align-items:center"><span style="font-family:var(--font-mono);font-size:1.2rem;font-weight:900;color:var(--brand-gold)">${avg.toFixed(1)}</span><span class="badge ${Fmt.grade(avg).bg}">${Fmt.grade(avg).g}</span></div></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.85rem"><thead><tr style="border-bottom:1px solid var(--border-light)">${['Subject','CA','Exam','Total','Grade','Remarks'].map(h=>`<th style="padding:8px 12px;text-align:${h==='Subject'?'left':'center'};font-size:.72rem;color:var(--text-muted);text-transform:uppercase">${h}</th>`).join('')}</tr></thead><tbody>${results.map(r=>{const gr=Fmt.grade(r.total_score);return`<tr style="border-bottom:1px solid rgba(255,255,255,.04)"><td style="padding:9px 12px;font-weight:600">${r.subject_name}</td><td style="padding:9px 12px;text-align:center;font-family:var(--font-mono)">${r.ca_score}</td><td style="padding:9px 12px;text-align:center;font-family:var(--font-mono)">${r.exam_score}</td><td style="padding:9px 12px;text-align:center;font-family:var(--font-mono);font-weight:700">${r.total_score}</td><td style="padding:9px 12px;text-align:center"><span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;font-weight:700;font-size:.8rem;background:${Fmt.gradeColor(gr.g)}22;color:${Fmt.gradeColor(gr.g)};border:1px solid ${Fmt.gradeColor(gr.g)}44">${gr.g}</span></td><td style="padding:9px 12px;color:var(--text-secondary);font-size:.82rem">${gr.r}</td></tr>`;}).join('')}</tbody></table></div></div>`;}).join('');
  }
}
function groupByTerm(results,meta){
  const groups={};results.forEach(r=>{const key=`${r.session_id||'s'}_${r.term_id||'t'}`;if(!groups[key])groups[key]={termName:r.term_name||meta.term_name||'Term',sessionName:r.session_name||meta.session_name||'Session',results:[]};groups[key].results.push(r);});return groups;
}
</script>
</body>
</html>
