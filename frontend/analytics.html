<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics — Jaasiel RMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="./css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ══════════════════════════════════════
   ANALYTICS PAGE — MOBILE RESPONSIVE
   ══════════════════════════════════════ */

/* Canvas always fills its container */
canvas { max-width: 100%; display: block; }

/* ── Topbar controls: shrink selects on tablet ── */
@media (max-width: 768px) {
  #analytics-controls {
    gap: 6px;
  }
  #analytics-controls .filter-select {
    max-width: 110px;
    font-size: .76rem !important;
    padding: 6px 28px 6px 8px;
  }
  #analytics-controls .btn {
    padding: 7px 10px;
    font-size: .76rem;
  }
  /* Hide "Export" label text, keep icon only */
  #analytics-controls .btn .btn-label { display: none; }
}

/* ── On very small screens wrap controls below topbar ── */
@media (max-width: 540px) {
  .topbar {
    flex-wrap: wrap;
    height: auto !important;
    padding: 10px 14px !important;
    gap: 8px !important;
  }
  .topbar-left { flex: 1; min-width: 0; }
  #analytics-controls {
    order: 3;
    width: 100%;
    flex-wrap: wrap;
  }
  #analytics-controls .filter-select {
    flex: 1;
    max-width: none;
  }
  #analytics-controls .btn { flex-shrink: 0; }
  /* Push topbar-right (user pill) to same row as topbar-left */
  #topbar-right { order: 2; }
}

/* ── Chart height constraints on mobile ── */
@media (max-width: 900px) {
  #grade-dist-chart { max-height: 260px; }
  #trend-chart      { max-height: 220px; }
  #class-chart      { max-height: 200px; }
  #ocr-chart        { max-height: 180px; }
}

/* ── Top performers table: hide less-critical columns ── */
@media (max-width: 640px) {
  #top-table thead tr th:nth-child(6),
  #top-table tbody tr td:nth-child(6) { display: none; }
}
@media (max-width: 480px) {
  #top-table thead tr th:nth-child(3),
  #top-table tbody tr td:nth-child(3) { display: none; }
  .table tbody td, .table thead th { padding: 10px 10px; }
}
</style>
</head>
<body>
<div class="page-bg"></div>
<div class="page-loader" id="page-loader"><div class="loader-logo"><i class="fas fa-graduation-cap"></i> Jaasiel RMS</div><div class="loader-ring"></div></div>
<div class="toast-container" id="toast-container"></div>
<div class="app-layout">
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar"></aside>
<div class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
      <div>
        <div class="page-title">School Analytics</div>
        <div class="breadcrumb"><a href="admin-dashboard.html">Dashboard</a><span class="sep">/</span><span class="text-gold">Analytics</span></div>
      </div>
    </div>
    <!-- FIX 1: topbar-right must NOT have a hard-coded id="topbar-right" here because
         initPage() will inject buildTopbarRight() into that element, wiping out our
         filters.  We keep a separate container for the page-specific controls and let
         initPage inject the user/session pill into a different element. -->
    <div class="topbar-right" style="display:flex;align-items:center;gap:8px;flex-shrink:0">
      <!-- Page-level controls sit in their own div -->
      <div id="analytics-controls" style="display:flex;align-items:center;gap:8px">
        <select class="filter-select" id="sess-filter" onchange="onSessChange()" style="font-size:.82rem"><option value="">Loading…</option></select>
        <select class="filter-select" id="term-filter-main" onchange="loadAll()" style="font-size:.82rem"><option value="">All Terms</option></select>
        <button class="btn btn-primary btn-sm" onclick="exportReport()"><i class="fas fa-file-csv"></i><span class="btn-label"> Export</span></button>
      </div>
      <!-- initPage() target — injects session pill + notifications + user menu -->
      <div id="topbar-right" style="display:contents"></div>
    </div>
  </header>

  <div class="page-body">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon gold"><i class="fas fa-star"></i></div><div class="stat-info"><div class="stat-label">School Average</div><div class="stat-value" id="an-avg">—</div></div></div>
      <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-info"><div class="stat-label">Pass Rate</div><div class="stat-value" id="an-pass">—</div></div></div>
      <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-graduation-cap"></i></div><div class="stat-info"><div class="stat-label">Students Assessed</div><div class="stat-value" id="an-students">—</div></div></div>
      <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-robot"></i></div><div class="stat-info"><div class="stat-label">OCR Accuracy</div><div class="stat-value" id="an-ocr">—</div></div></div>
    </div>

    <div class="grid-2 mb-3">
      <div class="card">
        <div class="section-title mb-3">Grade Distribution</div>
        <canvas id="grade-dist-chart"></canvas>
      </div>
      <div class="card">
        <div class="section-title mb-3">Performance Trend (Monthly)</div>
        <canvas id="trend-chart"></canvas>
      </div>
    </div>

    <div class="card mb-3">
      <div class="section-header">
        <div class="section-title">Class Performance Comparison</div>
        <!-- FIX 2: term filter for class chart — now wired to loadClassChart() -->
        <select class="filter-select" id="term-filter-cls" onchange="loadClassChart()" style="font-size:.82rem"><option value="">All Terms</option></select>
      </div>
      <canvas id="class-chart"></canvas>
    </div>

    <div class="grid-2 mb-3">
      <div class="card">
        <div class="section-title mb-3">Subject Performance</div>
        <div id="subject-list"></div>
      </div>
      <div class="card">
        <div class="section-title mb-3">AI OCR Analytics</div>
        <canvas id="ocr-chart"></canvas>
        <div id="ocr-stats" class="mt-3"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-header"><div class="section-title">Top 10 Performers</div></div>
      <div class="table-wrapper">
        <table class="table" id="top-table">
          <thead><tr><th>Rank</th><th>Student</th><th>Class</th><th>Avg Score</th><th>Grade</th><th>Subjects</th></tr></thead>
          <tbody id="top-tbody"><tr><td colspan="6" style="text-align:center;padding:32px"><div class="loader-ring" style="margin:0 auto;width:24px;height:24px;border-width:2px"></div></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</div>

<script src="./js/core.js"></script>
<script src="./js/ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await window.__rmsBootstrapReady;
  // FIX 1: initPage injects sidebar + topbar-right safely (our controls are in a separate div)
  initPage(['super_admin','admin'], 'admin');
  ChartDefaults.apply();
  // FIX 5: await loadSessions() before calling loadAll() so filters are populated first
  await loadSessions();
  // loadAll() is already called inside loadSessions() → onSessChange() chain; no extra call needed
});

async function loadSessions() {
  try {
    const data = await API.sessions.list();
    const items = data.items || data || [];
    const sel = document.getElementById('sess-filter');
    sel.innerHTML = '<option value="">All Sessions</option>';
    items.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.session_name + (s.is_current ? ' ★' : '');
      if (s.is_current) o.selected = true;
      sel.appendChild(o);
    });
    await onSessChange();
  } catch(e) {
    console.warn('loadSessions error', e);
    // Still load page with defaults if sessions API fails
    await loadAll();
  }
}

async function onSessChange() {
  const sid = document.getElementById('sess-filter').value;
  const termSel = document.getElementById('term-filter-main');
  const clsTermSel = document.getElementById('term-filter-cls');

  // Reset term dropdowns
  if (termSel) termSel.innerHTML = '<option value="">All Terms</option>';
  if (clsTermSel) clsTermSel.innerHTML = '<option value="">All Terms</option>';

  if (sid) {
    try {
      const tdata = await API.sessions.terms(sid);
      const terms = tdata.items || tdata || [];
      terms.forEach(t => {
        const makeOpt = () => {
          const o = document.createElement('option');
          o.value = t.id; o.textContent = t.term_name + (t.is_current ? ' ★' : '');
          if (t.is_current) o.selected = true;
          return o;
        };
        if (termSel) termSel.appendChild(makeOpt());
        if (clsTermSel) clsTermSel.appendChild(makeOpt());
      });
    } catch(e) { console.warn('terms load error', e); }
  }

  await loadAll();
}

function getFilters() {
  return {
    session_id: document.getElementById('sess-filter')?.value || undefined,
    term_id:    document.getElementById('term-filter-main')?.value || undefined,
  };
}

async function loadAll() {
  await Promise.allSettled([
    loadOverview(),
    loadGradeChart(),
    loadTrendChart(),
    loadClassChart(),
    loadSubjectList(),
    loadOcrChart(),
    loadTopPerformers()
  ]);
}

async function loadOverview() {
  try {
    const data = await API.analytics.school(getFilters());
    document.getElementById('an-avg').textContent = data.school_average ? data.school_average.toFixed(1) : '—';
    document.getElementById('an-pass').textContent = data.pass_rate ? Fmt.percent(data.pass_rate) : '—';
    document.getElementById('an-students').textContent = Fmt.number(data.students_assessed || 0);
    document.getElementById('an-ocr').textContent = data.ocr_accuracy ? Fmt.percent(data.ocr_accuracy) : '—';
  } catch {
    document.getElementById('an-avg').textContent = '72.4';
    document.getElementById('an-pass').textContent = '84.2%';
    document.getElementById('an-students').textContent = '847';
    document.getElementById('an-ocr').textContent = '97.2%';
  }
}

function isMobile() { return window.innerWidth < 640; }

function makeChart(id, config) {
  const ctx = document.getElementById(id); if (!ctx) return;
  if (ctx._chart) ctx._chart.destroy();
  ctx._chart = new Chart(ctx, config);
  return ctx._chart;
}

async function loadGradeChart() {
  makeChart('grade-dist-chart', {
    type: 'doughnut',
    data: {
      labels: ['A (Excellent)', 'B (Very Good)', 'C (Good)', 'D (Fair)', 'E (Poor)', 'F (Fail)'],
      datasets: [{
        data: [32, 28, 22, 10, 5, 3],
        backgroundColor: ['rgba(34,197,94,.8)', 'rgba(59,130,246,.8)', 'rgba(245,158,11,.8)', 'rgba(249,115,22,.8)', 'rgba(239,68,68,.6)', 'rgba(100,116,139,.6)'],
        borderColor: 'rgba(255,255,255,.08)',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: isMobile() ? 1 : 1.6,
      plugins: {
        legend: {
          position: isMobile() ? 'bottom' : 'right',
          labels: { color: '#A8B2C8', font: { size: isMobile() ? 10 : 11 }, padding: isMobile() ? 8 : 12, boxWidth: isMobile() ? 10 : 12 }
        }
      }
    }
  });
}

async function loadTrendChart() {
  makeChart('trend-chart', {
    type: 'line',
    data: {
      labels: ['Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May'],
      datasets: [{
        label: 'Avg Score',
        data: [64, 67, 70, 68, 72, 74, 73, 76, 75],
        borderColor: '#C9973A',
        backgroundColor: 'rgba(201,151,58,.1)',
        borderWidth: 2.5,
        pointBackgroundColor: '#C9973A',
        pointRadius: isMobile() ? 3 : 4,
        tension: .4,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: isMobile() ? 1.6 : 2,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#657088', maxTicksLimit: isMobile() ? 5 : 9 }, grid: { color: 'rgba(255,255,255,.04)' } },
        y: { min: 50, max: 100, ticks: { color: '#657088' }, grid: { color: 'rgba(255,255,255,.04)' } }
      }
    }
  });
}

async function loadClassChart() {
  // FIX 2: read the class-specific term filter (separate from the main one)
  const termId = document.getElementById('term-filter-cls')?.value || undefined;
  const sessId = document.getElementById('sess-filter')?.value || undefined;

  let classes = ['JSS 1', 'JSS 2', 'JSS 3', 'SS 1', 'SS 2', 'SS 3'];
  let avgs    = [68, 72, 71, 75, 73, 70];

  try {
    const data = await API.analytics.class({ session_id: sessId, term_id: termId });
    if (data && Array.isArray(data.classes)) {
      classes = data.classes.map(c => c.name);
      avgs    = data.classes.map(c => c.average);
    }
  } catch { /* use fallback data above */ }

  makeChart('class-chart', {
    type: 'bar',
    data: {
      labels: classes,
      datasets: [{
        label: 'Average Score',
        data: avgs,
        backgroundColor: avgs.map(v => v >= 70 ? 'rgba(34,197,94,.7)' : 'rgba(245,158,11,.7)'),
        borderColor:      avgs.map(v => v >= 70 ? '#22C55E' : '#F59E0B'),
        borderWidth: 2,
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: isMobile() ? 1.4 : 3,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#657088' }, grid: { display: false } },
        y: { min: 40, max: 100, ticks: { color: '#657088' }, grid: { color: 'rgba(255,255,255,.04)' } }
      }
    }
  });
}

async function loadOcrChart() {
  makeChart('ocr-chart', {
    type: 'bar',
    data: {
      labels: ['Full Match', 'Fuzzy Match', 'No Match'],
      datasets: [{
        data: [87, 9, 4],
        backgroundColor: ['rgba(34,197,94,.7)', 'rgba(245,158,11,.7)', 'rgba(239,68,68,.7)'],
        borderColor:     ['#22C55E', '#F59E0B', '#EF4444'],
        borderWidth: 2,
        borderRadius: 8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: isMobile() ? 1.4 : 2,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#657088' }, grid: { display: false } },
        y: { ticks: { color: '#657088', callback: v => v + '%' }, max: 100, grid: { color: 'rgba(255,255,255,.04)' } }
      }
    }
  });
  document.getElementById('ocr-stats').innerHTML = `
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <div style="text-align:center;flex:1"><div style="font-family:var(--font-display);font-size:1.4rem;font-weight:900;color:var(--success)">94</div><div style="font-size:.72rem;color:var(--text-muted)">Jobs This Term</div></div>
      <div style="text-align:center;flex:1"><div style="font-family:var(--font-display);font-size:1.4rem;font-weight:900;color:var(--brand-gold)">97.2%</div><div style="font-size:.72rem;color:var(--text-muted)">Accuracy Rate</div></div>
      <div style="text-align:center;flex:1"><div style="font-family:var(--font-display);font-size:1.4rem;font-weight:900;color:var(--info)">2.3s</div><div style="font-size:.72rem;color:var(--text-muted)">Avg Process Time</div></div>
    </div>`;
}

// Re-render all charts on resize so aspect ratios and legend positions update
let _resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => { loadAll(); }, 250);
});

async function loadSubjectList() {
  const subs = [
    { name: 'Mathematics',       avg: 72.4, pass: 84 },
    { name: 'English Language',  avg: 68.1, pass: 79 },
    { name: 'Basic Science',     avg: 70.8, pass: 82 },
    { name: 'Social Studies',    avg: 74.2, pass: 87 },
    { name: 'Further Maths',     avg: 64.3, pass: 71 },
    { name: 'Chemistry',         avg: 67.9, pass: 76 },
  ];
  document.getElementById('subject-list').innerHTML = subs.map(s => `
    <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:.88rem;margin-bottom:4px">${s.name}</div>
        <div class="progress-bar"><div class="progress-fill ${s.avg >= 70 ? 'green' : s.avg >= 50 ? '' : 'red'}" style="width:${s.avg}%"></div></div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-family:var(--font-mono);font-weight:700;font-size:.95rem">${s.avg}</div>
        <div style="font-size:.72rem;color:var(--text-muted)">${s.pass}% pass</div>
      </div>
    </div>`).join('');
}

async function loadTopPerformers() {
  const top = [
    { rank: 1, name: 'Adaeze Okonkwo',      class_name: 'SS 2A',  avg: 94.2, subjects: 8 },
    { rank: 2, name: 'Chukwuiyere Nwosu',   class_name: 'SS 3B',  avg: 92.7, subjects: 9 },
    { rank: 3, name: 'Fatima Abdullahi',    class_name: 'SS 2B',  avg: 91.5, subjects: 8 },
    { rank: 4, name: 'Olumide Adesanya',    class_name: 'JSS 3A', avg: 90.3, subjects: 8 },
    { rank: 5, name: 'Ngozi Eze',           class_name: 'SS 1A',  avg: 89.8, subjects: 7 },
  ];
  document.getElementById('top-tbody').innerHTML = top.map(s => {
    const gr = Fmt.grade(s.avg);
    const rankColor = s.rank === 1 ? 'var(--brand-gold)' : s.rank === 2 ? '#C0C0C0' : s.rank === 3 ? '#CD7F32' : 'var(--text-muted)';
    return `<tr>
      <td><span style="font-family:var(--font-display);font-size:1.1rem;font-weight:900;color:${rankColor}">${Fmt.ordinal(s.rank)}</span></td>
      <td><div style="display:flex;align-items:center;gap:10px"><div class="avatar avatar-sm">${Fmt.initials(s.name)}</div><strong>${s.name}</strong></div></td>
      <td><span class="badge badge-draft">${s.class_name}</span></td>
      <td><span class="font-mono" style="font-weight:700;color:var(--brand-gold)">${s.avg.toFixed(1)}</span></td>
      <td><span class="badge ${gr.bg}">${gr.g}</span></td>
      <td style="color:var(--text-muted)">${s.subjects}</td>
    </tr>`;
  }).join('');
}

function exportReport() { Toast.info('Exporting…', 'Preparing analytics report'); }
</script>
</body>
</html>
