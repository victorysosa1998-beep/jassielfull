<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Access Denied — Jaasiel RMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="page-bg"></div>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="text-align:center;max-width:400px">
    <div style="width:80px;height:80px;border-radius:20px;background:var(--danger-bg);border:1px solid rgba(239,68,68,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:2rem;color:var(--danger)"><i class="fas fa-shield-exclamation"></i></div>
    <h1 style="font-family:var(--font-display);font-size:2rem;font-weight:900;margin-bottom:12px">Access Denied</h1>
    <p style="color:var(--text-secondary);margin-bottom:28px">You don't have permission to view this page. Please sign in with an account that has the required role.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="login.html" class="btn btn-primary"><i class="fas fa-right-to-bracket"></i> Sign In</a>
      <button class="btn btn-ghost" onclick="history.back()"><i class="fas fa-arrow-left"></i> Go Back</button>
    </div>
  </div>
</div>
<script src="./js/core.js"></script>
</body>
</html>
