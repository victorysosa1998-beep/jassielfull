<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Results — Jaasiel RMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
html, body { overflow-x: hidden; }
.main-content, .page-body { overflow-x: hidden; min-width: 0; }

.result-row { cursor: default; }
.mode-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 20px; font-size: .72rem; font-weight: 600; border: 1px solid;
}
.mode-badge.current { background:rgba(201,151,58,.12); color:var(--brand-gold); border-color:rgba(201,151,58,.3); }
.mode-badge.all     { background:rgba(99,179,237,.1);  color:#63b3ed;           border-color:rgba(99,179,237,.25); }
.view-rc-btn {
  display:inline-flex; align-items:center; gap:6px; padding:7px 14px;
  border-radius:8px; font-size:.82rem; font-weight:600;
  background:linear-gradient(135deg,#C9973A,#9A6E20); color:#fff;
  text-decoration:none; transition:opacity .15s,transform .15s; white-space:nowrap;
}
.view-rc-btn:hover { opacity:.88; transform:translateY(-1px); }

@media (max-width: 768px) {
  .results-table-wrapper { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .term-card-header { flex-direction:column !important; align-items:flex-start !important; gap:10px !important; }
  .filter-bar { flex-wrap: wrap; }
  .filter-bar select { flex:1; min-width:120px; }
  .student-banner { flex-direction:column; align-items:flex-start !important; gap:12px; }
}
@media (max-width: 480px) {
  #results-table th:nth-child(3),
  #results-table td:nth-child(3),
  #results-table th:nth-child(4),
  #results-table td:nth-child(4) { display:none; }
}
</style>
</head>
<body>
<div class="page-bg"></div>
<div class="page-loader" id="page-loader"><div class="loader-logo"><i class="fas fa-graduation-cap"></i> Jaasiel RMS</div><div class="loader-ring"></div></div>
<div class="toast-container" id="toast-container"></div>
<div class="app-layout">
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar"></aside>
<div class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
      <div>
        <div class="page-title" id="page-title">Student Results</div>
        <div class="breadcrumb">
          <a href="students.html">Students</a>
          <span class="sep">/</span>
          <span class="text-gold" id="breadcrumb-name">Results</span>
        </div>
      </div>
    </div>
    <div class="topbar-right" id="topbar-right">
      <a href="students.html" class="btn btn-ghost btn-sm"><i class="fas fa-arrow-left"></i> <span class="btn-back-label">Back to Students</span></a>
    </div>
  </header>

  <div class="page-body">

    <!-- Student identity banner -->
    <div class="welcome-banner mb-3" id="student-banner" style="display:none">
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap" class="student-banner">
        <div class="avatar avatar-lg" id="banner-avatar" style="overflow:hidden;flex-shrink:0"></div>
        <div>
          <div style="font-family:var(--font-display);font-size:clamp(1rem,2.5vw,1.3rem);font-weight:700" id="banner-name">—</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px" id="banner-badges"></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0">
        <a id="edit-student-btn" href="#" class="btn btn-secondary btn-sm"><i class="fas fa-pen"></i> Edit Student</a>
        <!-- <a id="report-card-btn" href="#" class="btn btn-primary btn-sm"><i class="fas fa-file-pdf"></i> Report Card</a> -->
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar mb-3" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <select class="filter-select" id="session-filter" onchange="onSessionChange()" style="flex:1;min-width:120px;max-width:200px">
        <option value="">All Sessions</option>
      </select>
      <select class="filter-select" id="term-filter" onchange="loadResults()" style="flex:1;min-width:100px;max-width:160px">
        <option value="">All Terms</option>
      </select>
      <div id="mode-indicator"></div>
    </div>

    <!-- Results container -->
    <div id="results-container"></div>
  </div>
</div>
</div>

<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script>
const params     = new URLSearchParams(window.location.search);
const STUDENT_ID = params.get('student_id');
let _sessions    = [];
let _studentData = null;

document.addEventListener('DOMContentLoaded', async () => {
  await window.__rmsBootstrapReady;
  const role = AuthState.getRole();
  initPage(['super_admin', 'admin', 'sub_admin'], 'admin');

  if (!STUDENT_ID) {
    document.getElementById('results-container').innerHTML =
      `<div class="card" style="text-align:center;padding:48px;color:var(--danger)">
        <i class="fas fa-circle-exclamation" style="font-size:2rem;display:block;margin-bottom:12px"></i>
        No student specified. <a href="students.html" class="text-gold">Return to Students</a>
      </div>`;
    return;
  }

  await Promise.all([loadStudentInfo(), loadSessions()]);
  loadResults();
});

/* ── Load student profile for the banner ── */
async function loadStudentInfo() {
  try {
    const s = await API.students.get(STUDENT_ID);
    _studentData = s;

    document.getElementById('page-title').textContent       = `${s.full_name} — Results`;
    document.getElementById('breadcrumb-name').textContent  = s.full_name;
    document.getElementById('banner-name').textContent      = s.full_name;
    document.getElementById('edit-student-btn').href        = `add-student.html?id=${s.id}`;

    const avatar = document.getElementById('banner-avatar');
    avatar.innerHTML = s.photo_url
      ? `<img src="${s.photo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
      : `<span style="font-size:1.4rem">${Fmt.initials(s.full_name)}</span>`;

    document.getElementById('banner-badges').innerHTML = [
      `<span class="badge badge-gold"><i class="fas fa-school"></i> ${s.class_name || 'No class'}</span>`,
      `<span class="badge badge-draft">${s.student_id || '—'}</span>`,
      `<span class="badge ${s.is_active ? 'badge-approved' : 'badge-rejected'}">${s.is_active ? 'Active' : 'Inactive'}</span>`,
      s.gender ? `<span class="badge badge-draft" style="text-transform:capitalize">${s.gender}</span>` : '',
    ].join('');

    document.getElementById('student-banner').style.display = '';
  } catch(e) {
    console.warn('Could not load student info', e);
  }
}

/* ── Session / term dropdowns ── */
async function loadSessions() {
  try {
    const data = await API.sessions.list();
    _sessions  = data.items || data || [];
    const sessSel = document.getElementById('session-filter');
    sessSel.innerHTML = '<option value="">All Sessions</option>';
    _sessions.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.session_name + (s.is_current ? ' ★' : '');
      if (s.is_current) o.selected = true;
      sessSel.appendChild(o);
    });
    populateTerms(sessSel.value);
  } catch(e) { console.warn('loadSessions failed', e); }
}

function populateTerms(sid) {
  const termSel = document.getElementById('term-filter');
  termSel.innerHTML = '<option value="">All Terms</option>';
  const sess = _sessions.find(s => String(s.id) === String(sid));
  if (sess && sess.terms) {
    sess.terms.forEach(t => {
      const o = document.createElement('option');
      o.value = t.id; o.textContent = t.term_name + (t.is_current ? ' ★' : '');
      if (t.is_current) o.selected = true;
      termSel.appendChild(o);
    });
  }
}

function onSessionChange() {
  populateTerms(document.getElementById('session-filter').value);
  loadResults();
}

/* ── Main results loader ── */
async function loadResults() {
  const container = document.getElementById('results-container');
  const modeEl    = document.getElementById('mode-indicator');
  showSkeleton(container, 3, '120px', '14px');

  const sid     = document.getElementById('session-filter').value;
  const tid     = document.getElementById('term-filter').value;
  const showAll = !sid && !tid;

  modeEl.innerHTML = showAll
    ? `<span class="mode-badge all"><i class="fas fa-layer-group"></i> All results</span>`
    : `<span class="mode-badge current"><i class="fas fa-filter"></i> Filtered view</span>`;

  // Update report card link with current filters
  const rcParams = new URLSearchParams({ student_id: STUDENT_ID });
  if (sid) rcParams.set('session_id', sid);
  if (tid) rcParams.set('term_id', tid);
  const rcBtn = document.getElementById('report-card-btn');
  if (rcBtn) rcBtn.href = `admin-report-card.htm?${rcParams}`;

  try {
    const apiParams = { student_id: STUDENT_ID };
    if (sid) apiParams.session_id = sid;
    if (tid) apiParams.term_id    = tid;

    const data       = await API.students.results(STUDENT_ID, apiParams);
    const rawResults = data.results || data.items || data || [];

    if (!rawResults.length) {
      container.innerHTML = `<div class="card" style="text-align:center;padding:48px;color:var(--text-muted)">
        <i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:12px"></i>
        No published results found for this student${showAll ? '' : ' in the selected period'}.
      </div>`;
      return;
    }

    const grouped = groupByTerm(rawResults, data);
    container.innerHTML = Object.entries(grouped).map(([, { termName, sessionName, sessionId, termId, results }]) => {
      const avgs  = results.map(r => r.total_score || 0);
      const avg   = avgs.length ? avgs.reduce((a, b) => a + b, 0) / avgs.length : 0;
      const gr    = Fmt.grade(avg);
      const rcUrl = `admin-report-card.htm?student_id=${STUDENT_ID}&session_id=${encodeURIComponent(sessionId)}&term_id=${encodeURIComponent(termId)}`;

      return `<div class="card mb-3">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px" class="term-card-header">
          <div>
            <div style="font-family:var(--font-display);font-weight:700;font-size:1rem">${termName}</div>
            <div style="font-size:.78rem;color:var(--text-muted)">${sessionName}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <span style="font-family:var(--font-mono);font-size:1.2rem;font-weight:900;color:var(--brand-gold)">${avg.toFixed(1)}</span>
            <span class="badge ${gr.bg}">${gr.g}</span>
        
          </div>
        </div>

        <div class="results-table-wrapper" style="overflow-x:auto;-webkit-overflow-scrolling:touch">
          <table id="results-table" style="width:100%;border-collapse:collapse;font-size:.85rem;min-width:520px">
            <thead>
              <tr style="border-bottom:1px solid var(--border-light)">
                ${['Subject','1st Test','2nd Test','CA','Exam','Total','Grade','Remarks'].map(h =>
                  `<th style="padding:8px 12px;text-align:${h==='Subject'?'left':'center'};font-size:.72rem;color:var(--text-muted);text-transform:uppercase">${h}</th>`
                ).join('')}
              </tr>
            </thead>
            <tbody>
              ${results.map(r => {
                const rgr = Fmt.grade(r.total_score || 0);
                return `<tr class="result-row" style="border-bottom:1px solid rgba(255,255,255,.04)">
                  <td style="padding:9px 12px;font-weight:600">${r.subject_name || '—'}</td>
                  <td style="padding:9px 12px;text-align:center;font-family:var(--font-mono)">${r.first_test  ?? '—'}</td>
                  <td style="padding:9px 12px;text-align:center;font-family:var(--font-mono)">${r.second_test ?? '—'}</td>
                  <td style="padding:9px 12px;text-align:center;font-family:var(--font-mono)">${r.ca_score    ?? '—'}</td>
                  <td style="padding:9px 12px;text-align:center;font-family:var(--font-mono)">${r.exam_score  ?? '—'}</td>
                  <td style="padding:9px 12px;text-align:center;font-family:var(--font-mono);font-weight:700">${r.total_score ?? '—'}</td>
                  <td style="padding:9px 12px;text-align:center">
                    <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;font-weight:700;font-size:.8rem;background:${Fmt.gradeColor(rgr.g)}22;color:${Fmt.gradeColor(rgr.g)};border:1px solid ${Fmt.gradeColor(rgr.g)}44">${rgr.g}</span>
                  </td>
                  <td style="padding:9px 12px;color:var(--text-secondary);font-size:.82rem">${rgr.r}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>

        <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end">
      
        </div>
      </div>`;
    }).join('');

  } catch(e) {
    console.error(e);
    container.innerHTML = `<div class="card" style="text-align:center;padding:48px;color:var(--text-muted)">
      <i class="fas fa-exclamation-circle" style="font-size:2rem;display:block;margin-bottom:12px"></i>
      Could not load results. Please try again.</div>`;
  }
}

/* ── Group results by term ── */
function groupByTerm(results, meta) {
  const groups = {};
  results.forEach(r => {
    const key = `${r.session_id || 's'}_${r.term_id || 't'}`;
    if (!groups[key]) groups[key] = {
      termName:    r.term_name    || meta.term_name    || 'Term',
      sessionName: r.session_name || meta.session_name || 'Session',
      sessionId:   r.session_id   || '',
      termId:      r.term_id      || '',
      results:     []
    };
    groups[key].results.push(r);
  });
  return groups;
}
</script>
</body>
</html>
