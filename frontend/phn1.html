<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Review</title>

<style>
    :root {
        --monzo-red: #ff4d4d;
        --text-dark: #1c1c1c;
        --text-grey: #6b7280;
        --bg-soft: #fff5f5;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background: #ffffff;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* HEADER */
    .header {
        display: flex;
        align-items: center;
        padding: 18px 16px;
        border-bottom: 1px solid #eee;
    }

    .back {
        font-size: 20px;
        margin-right: 14px;
        cursor: pointer;
        color: var(--text-dark);
    }

    .title-block {
        display: flex;
        flex-direction: column;
    }

    .title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-dark);
    }

    .sub {
        font-size: 12px;
        color: var(--text-grey);
        margin-top: 2px;
    }

    /* CONTENT */
    .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
    }

    .icon {
        width: 74px;
        height: 74px;
        border-radius: 50%;
        background: rgba(255, 77, 77, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        color: var(--monzo-red);
        margin-bottom: 18px;
    }

    h1 {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 10px;
    }

    p {
        font-size: 14px;
        color: var(--text-grey);
        line-height: 1.6;
        max-width: 340px;
    }

    .notice {
        margin-top: 14px;
        padding: 12px;
        border-radius: 10px;
        background: var(--bg-soft);
        border: 1px solid #ffd6d6;
        font-size: 13px;
        color: var(--monzo-red);
        max-width: 340px;
    }

    /* FOOTER */
    .footer {
        padding: 16px;
        border-top: 1px solid #eee;
    }

    .btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        margin-bottom: 10px;
    }

    .btn-primary {
        background: var(--monzo-red);
        color: white;
    }

    .btn-secondary {
        background: #f3f4f6;
        color: var(--text-dark);
    }
</style>
</head>

<body>

<div class="header">
    <div class="back">←</div>
    <div class="title-block">
        <div class="title">Account review</div>
        <div class="sub">Balance £3,390</div>
    </div>
</div>

<div class="content">

    <div class="icon">⚠️</div>

    <h1>Account temporarily restricted</h1>

    <p>
        We’ve detected unusual activity on your account.
        For your security, outgoing transfers are currently paused.
    </p>

    <div class="notice">
        You will need to verify your identity before you can continue using your account normally.
    </div>

</div>

<div class="footer">
    <button class="btn btn-primary">Verify identity</button>
    <button class="btn btn-secondary">Go back to dashboard</button>
</div>

</body>
</html>
